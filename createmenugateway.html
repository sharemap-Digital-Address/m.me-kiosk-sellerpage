<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareMap - Kiosk Menu Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2563eb; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --border: #334155; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; }
        input, select, textarea, button { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 6px; background: #0f172a; color: #fff; box-sizing: border-box; font-size: 14px; }
        button { background-color: var(--primary); font-weight: bold; cursor: pointer; border: none; }
        button:hover { opacity: 0.9; }
        .menu-item { display: flex; align-items: center; justify-content: space-between; background: #334155; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
        .menu-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; margin-right: 10px; }
        .menu-info { flex-grow: 1; }
        .status-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .avail { background: #166534; color: #dcfce7; }
        .not-avail { background: #991b1b; color: #fee2e2; }
        .alert-box { background: #0284c7; color: white; padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 12px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>🍔 Store Menu Manager</h2>

    <!-- Store Login Credentials -->
    <div class="card" id="loginCard">
        <h3>🔑 Store Login</h3>
        <label>Store Page Username:</label>
        <input type="text" id="storeUsername" placeholder="halimbawa: marjevinsoylucena" onchange="checkStorePasswordStatus()">
        
        <!-- Dinamikong Note/Alert -->
        <div id="statusNotice" style="display:none;" class="alert-box"></div>

        <!-- Password Field Wrapper -->
        <div id="passwordWrapper">
            <label>Password:</label>
            <input type="password" id="storePassword" placeholder="I-type ang iyong password">
        </div>
        
        <!-- Dinamikong Action Button -->
        <button id="loginActionBtn" onclick="loginAndLoadMenu()">Log In & Load Menu</button>
    </div>

    <div id="managerSection" style="display: none;">
        <!-- Add / Edit Menu Form -->
        <div class="card">
            <h3>Magdagdag / Mag-edit ng Item</h3>
            <input type="hidden" id="editItemId" value="">
            
            <label>Product Name:</label>
            <input type="text" id="prodName" placeholder="halimbawa: Halo-Halo Special">

            <label>Image Link URL (Google Drive / ImgBB):</label>
            <input type="url" id="prodImage" placeholder="I-paste ang Google Drive Share Link dito">
            <small style="font-size: 11px; color: #38bdf8; display: block; margin-top: -8px; margin-bottom: 10px;">💡 Awtomatikong iko-convert ang Google Drive link para bumilis ang load.</small>

            <label>Description (Opsyonal):</label>
            <textarea id="prodDesc" rows="2" placeholder="halimbawa: May leche flan at ice cream"></textarea>

            <label>Status Availability:</label>
            <select id="prodStatus">
                <option value="AVAILABLE">Available</option>
                <option value="UNAVAILABLE">Not Available (Out of Stock)</option>
            </select>

            <button onclick="saveMenuItem()" style="background:#16a34a;">I-save ang Item sa Database</button>
        </div>

        <!-- Active Menu List -->
        <div class="card">
            <h3>Lista ng mga Item sa Kiosk</h3>
            <div id="menuContainer">
                <p style="text-align:center; color:#94a3b8;">Lino-load ang menu...</p>
            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://qeqbnhpvarsdcrdzpycr.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_KwWNvUe_KuZatiWB8nVvkQ_56JRPiif";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeStore = "";
    let currentMenuItems = [];
    let hasPasswordSet = false;

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const storeFromUrl = urlParams.get('page') || localStorage.getItem('sharemap_page');
        if(storeFromUrl) {
            document.getElementById('storeUsername').value = storeFromUrl.toLowerCase();
            checkStorePasswordStatus();
        }
    };

    // REGEX FUNCTION PARA SA GOOGLE DRIVE LINK CONVERSION
    function convertGoogleDriveLink(rawUrl) {
        if (!rawUrl) return "";
        rawUrl = rawUrl.trim();

        // Regex para makuha ang File ID sa loob ng Google Drive link (hal. /d/FILE_ID/ o id=FILE_ID)
        const driveRegex = /(?:\/d\/|id=)([a-zA-Z0-9_-]{25,})/;
        const match = rawUrl.match(driveRegex);

        if (match && match[1]) {
            let fileId = match[1];
            // Ibalik ang tamang format na direktang babasahin bilang larawan
            return `https://lh3.googleusercontent.com/d/${fileId}`;
        }

        // Kung hindi Google Drive link (halimbawa ImgBB o iba pa), ibalik lang kung ano ang niliagay
        return rawUrl;
    }

    async function checkStorePasswordStatus() {
        const username = document.getElementById('storeUsername').value.trim().toLowerCase();
        const pwdWrapper = document.getElementById('passwordWrapper');
        const actionBtn = document.getElementById('loginActionBtn');
        const notice = document.getElementById('statusNotice');

        if(!username) return;

        const { data, error } = await supabaseClient
            .from('licenses')
            .select('password')
            .eq('username', username)
            .single();

        if (error || !data) {
            notice.style.display = "block";
            notice.style.background = "#ef4444";
            notice.innerText = "❌ Walang natagpung lisensyadong Store Account sa pangalang ito.";
            pwdWrapper.style.display = "none";
            actionBtn.style.display = "none";
            return;
        }

        if (!data.password || data.password.trim() === "") {
            hasPasswordSet = false;
            pwdWrapper.style.display = "none";
            notice.style.display = "block";
            notice.style.background = "#eab308";
            notice.style.color = "#000";
            notice.innerHTML = "⚠️ <b>Wala ka pang nalilikhang Password!</b><br>Kailangan mo munang mag-set ng password para sa iyong store.";
            
            actionBtn.style.display = "block";
            actionBtn.style.background = "#16a34a";
            actionBtn.innerText = "🔑 Gumawa ng Password Muna (Setup Account)";
            actionBtn.onclick = function() {
                window.location.href = `./accountgateway.html?page=${encodeURIComponent(username)}`;
            };
        } else {
            hasPasswordSet = true;
            pwdWrapper.style.display = "block";
            notice.style.display = "none";
            
            actionBtn.style.display = "block";
            actionBtn.style.background = "#2563eb";
            actionBtn.innerText = "Log In & Load Menu";
            actionBtn.onclick = loginAndLoadMenu;
        }
    }

    async function loginAndLoadMenu() {
        const username = document.getElementById('storeUsername').value.trim().toLowerCase();
        const pwd = document.getElementById('storePassword').value.trim();

        if(!username || !pwd) {
            alert("Pakipunan ang Store Username at Password!");
            return;
        }

        const { data, error } = await supabaseClient
            .from('licenses')
            .select('*')
            .eq('username', username)
            .single();

        if(error || !data) {
            alert("❌ Walang natagpung Store Account.");
            return;
        }

        if(data.password !== pwd) {
            alert("❌ Mali ang Password! Subukang muli.");
            return;
        }

        activeStore = username;
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('managerSection').style.display = 'block';

        loadStoreMenuItems();
    }

    async function loadStoreMenuItems() {
        const { data, error } = await supabaseClient
            .from('menu_items')
            .select('*')
            .eq('username', activeStore)
            .order('created_at', { ascending: false });

        if(error) {
            alert("Error sa pag-load ng menu: " + error.message);
            return;
        }

        currentMenuItems = data || [];
        renderMenuList();
    }

    function renderMenuList() {
        const container = document.getElementById('menuContainer');
        container.innerHTML = "";

        if(currentMenuItems.length === 0) {
            container.innerHTML = "<p style='text-align:center; color:#94a3b8;'>Wala pang item sa kiosk menu.</p>";
            return;
        }

        currentMenuItems.forEach((item) => {
            let isAvail = item.status === "AVAILABLE";
            let div = document.createElement('div');
            div.className = "menu-item";
            div.innerHTML = `
                <img src="${item.image || 'https://via.placeholder.com/50'}" alt="Item">
                <div class="menu-info">
                    <strong>${item.name}</strong> 
                    <span class="status-badge ${isAvail ? 'avail':'not-avail'}">${item.status}</span>
                    <div style="font-size:11px; color:#cbd5e1;">${item.description || ''}</div>
                </div>
                <div>
                    <button onclick="editItem(${item.id})" style="width:auto; padding:5px 8px; font-size:11px;">Edit</button>
                    <button onclick="deleteItem(${item.id})" style="width:auto; padding:5px 8px; font-size:11px; background:#dc2626;">Del</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    async function saveMenuItem() {
        const name = document.getElementById('prodName').value.trim();
        const rawImageInput = document.getElementById('prodImage').value.trim();
        const desc = document.getElementById('prodDesc').value.trim();
        const status = document.getElementById('prodStatus').value;
        const itemId = document.getElementById('editItemId').value;

        if(!name) { alert("Pakilagay ang Product Name!"); return; }

        // ISASALANG SA REGEX CONVERTER ANG LINK BAGO ISE-SAVE SA DATABASE
        const finalImageUrl = convertGoogleDriveLink(rawImageInput);

        const payload = {
            username: activeStore,
            name: name,
            image: finalImageUrl,
            description: desc,
            status: status
        };

        let result;
        if(itemId) {
            result = await supabaseClient.from('menu_items').update(payload).eq('id', itemId);
        } else {
            result = await supabaseClient.from('menu_items').insert([payload]);
        }

        if(result.error) {
            alert("Error sa pag-save: " + result.error.message);
        } else {
            alert("✅ Nai-save na ang item na may converted Google Drive image link!");
            document.getElementById('prodName').value = "";
            document.getElementById('prodImage').value = "";
            document.getElementById('prodDesc').value = "";
            document.getElementById('editItemId').value = "";
            
            loadStoreMenuItems();
        }
    }

    function editItem(id) {
        let item = currentMenuItems.find(i => i.id === id);
        if(item) {
            document.getElementById('prodName').value = item.name;
            document.getElementById('prodImage').value = item.image || "";
            document.getElementById('prodDesc').value = item.description || "";
            document.getElementById('prodStatus').value = item.status;
            document.getElementById('editItemId').value = item.id;
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    }

    async function deleteItem(id) {
        if(confirm("Sigurado ka bang buburahin ang item na ito?")) {
            const { error } = await supabaseClient.from('menu_items').delete().eq('id', id);
            if(error) {
                alert("Error sa pagbura: " + error.message);
            } else {
                loadStoreMenuItems();
            }
        }
    }
</script>
</body>
</html>
