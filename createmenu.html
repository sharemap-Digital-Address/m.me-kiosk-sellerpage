<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareMap - Kiosk Menu Manager & Theme Customizer</title>
    <style>
        :root { --primary: #0284c7; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --border: #334155; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; }
        input, select, textarea, button { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 6px; background: #0f172a; color: #fff; box-sizing: border-box; font-size: 14px; }
        button { background-color: var(--primary); font-weight: bold; cursor: pointer; border: none; }
        .btn-blue { background: #0284c7; } .btn-green { background: #16a34a; }
        .item-row { background: #334155; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .alert-box { background: #0284c7; color: white; padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 12px; text-align: center; }
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 2000; }
        .drawer-content { position: fixed; top: 0; left: -290px; width: 280px; height: 100%; background: #1e293b; border-right: 1px solid #334155; z-index: 2001; padding: 20px; box-sizing: border-box; transition: left 0.3s ease; display: flex; flex-direction: column; justify-content: space-between; }
        .drawer-open .drawer-content { left: 0; } .drawer-open .drawer-overlay { display: block; }
        .drawer-menu-item { display: flex; align-items: center; gap: 10px; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-weight: bold; font-size: 13px; cursor: pointer; margin-bottom: 10px; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 20px; }
        .switch-container { display: flex; align-items: center; justify-content: space-between; background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #475569; margin-bottom: 12px; }
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; } .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #16a34a; } input:checked + .slider:before { transform: translateX(22px); }
        .variant-chips-container { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; margin-bottom: 12px; }
        .variant-chip-card { background: #0f172a; border: 1px solid #38bdf8; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .color-picker-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .color-picker-row input[type="color"] { width: 50px; height: 38px; padding: 2px; margin: 0; }
    </style>
</head>
<body>
<div class="container">
    <h2>🍔 Store Menu Manager</h2>
    <div class="card" id="loginCard">
        <h3>🔑 Store Login</h3>
        <label>Store Page Username:</label>
        <input type="text" id="storeUsername" placeholder="halimbawa: MyFbPageUsername">
        <div id="statusNotice" style="display:none;" class="alert-box"></div>
        <div id="passwordWrapper">
            <label>Password:</label>
            <input type="password" id="storePassword" placeholder="I-type ang iyong password">
        </div>
        <button id="loginActionBtn" onclick="loginAndLoadMenu()">Log In & Load Menu</button>
        <p style="font-size:10px; color:#64748b; text-align:center; margin-top:8px;">SECURED via verify-and-update-theme</p>
    </div>
    <div id="managerSection" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #1e293b; padding: 10px 14px; border-radius: 8px; border: 1px solid #334155;">
            <button onclick="toggleDrawer()" style="width: auto; padding: 6px 12px; font-size: 13px; background: #0284c7; margin:0;">☰🛠</button>
            <span style="font-size: 12px; color: #38bdf8;">Logged as: <b id="activeStoreLabel"></b></span>
        </div>
        <div id="drawerOverlay" class="drawer-overlay" onclick="toggleDrawer()"></div>
        <div id="drawerMenu" class="drawer-content">
            <div>
                <div class="drawer-header">
                    <span style="font-weight: bold; color: #38bdf8; font-size: 15px;">⚙️ Store Settings</span>
                    <button onclick="toggleDrawer()" style="width: auto; padding: 2px 8px; background: #ef4444; font-size: 11px; margin: 0;">✕</button>
                </div>
                <div class="drawer-menu-item" onclick="switchTab('menuTab')"><span>🛒</span> Menu Items List</div>
                <div class="drawer-menu-item" onclick="protectedAction('themeTab')"><span>🎨</span> Kiosk Theme Customizer</div>
                <div class="drawer-menu-item" onclick="protectedAction('reconfigTab')"><span>⚙️</span> Re-config Google Sheet</div>
            </div>
            <button onclick="logoutStore()" style="background: #dc2626; color: white; padding: 10px; font-size: 12px; margin:0;">🚪 Log Out Store</button>
        </div>
        <div id="themeSettingsSection" class="card" style="display: none; border: 1px solid #8b5cf6;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin-top:0; color:#c084fc;">🎨 Kiosk Theme</h3>
                <button onclick="resetThemeToDefault()" style="width:auto; padding:4px 8px; font-size:10px; background:#64748b; margin:0;">🔄 Reset Default</button>
            </div>
            <label style="font-size: 12px; font-weight: bold; color:#38bdf8;">Store Circle Logo Image Link:</label>
            <input type="url" id="themeStoreLogo" placeholder="Google Drive / ImgBB link">
            <label style="font-size: 12px; font-weight: bold;">Primary Accent Color:</label>
            <div class="color-picker-row">
                <input type="color" id="themePrimaryColor" value="#0284c7" onchange="document.getElementById('themePrimaryHex').value = this.value">
                <input type="text" id="themePrimaryHex" value="#0284c7" style="margin:0;" onchange="document.getElementById('themePrimaryColor').value = this.value">
            </div>
            <label style="font-size: 12px; font-weight: bold;">Background Theme Style:</label>
            <select id="themeBgType" onchange="toggleThemeTypeFields()">
                <option value="default">Default Dark Slate</option>
                <option value="color">Solid Dark Color</option>
                <option value="gradient">Modern Dark Gradient</option>
                <option value="image">Google Drive Wallpaper</option>
            </select>
            <div id="themeColorBox" style="display:none;">
                <label style="font-size: 12px;">Background Color:</label>
                <div class="color-picker-row">
                    <input type="color" id="themeBgColor" value="#0f172a" onchange="document.getElementById('themeBgHex').value = this.value">
                    <input type="text" id="themeBgHex" value="#0f172a" style="margin:0;" onchange="document.getElementById('themeBgColor').value = this.value">
                </div>
            </div>
            <div id="themeImageBox" style="display:none;">
                <label style="font-size: 12px; color:#38bdf8;">Google Drive Wallpaper Link:</label>
                <input type="url" id="themeDriveImage" placeholder="Google Drive share link">
            </div>
            <button class="btn-blue" onclick="saveStoreThemeSettings()" style="margin-bottom:0;">💾 I-save ang Theme Settings</button>
        </div>
        <div id="reconfigSection" class="card" style="display: none;">
            <h3 style="margin-top:0; color:#38bdf8;">⚙️ Re-config Google Sheet Link</h3>
            <label style="font-size: 12px;">Web App URL (/exec):</label>
            <input type="text" id="sheetWebhookUrl" placeholder="https://script.google.com/macros/s/.../exec">
            <button class="btn-green" onclick="saveSheetUrlToSupabase()" style="background:#16a34a;">💾 Save Google Sheet Link</button>
        </div>
        <div id="mainMenuSection">
            <div class="card" id="menuFormCard" style="display: none; border: 1px solid #38bdf8;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 id="formTitle" style="margin: 0; color: #38bdf8;">➕ Magdagdag ng Item</h3>
                    <button onclick="hideMenuForm()" style="width: auto; padding: 4px 10px; background: #64748b; font-size: 11px; margin: 0;">❌ Isara</button>
                </div>
                <label style="font-size: 12px; font-weight: bold; margin-top: 10px; display: block; color:#38bdf8;">📦 Overall Product Type:</label>
                <input type="text" id="prodType" placeholder="hal. Food">
                <label style="font-size: 12px; font-weight: bold; display: block;">🏷️ Item Tab Category:</label>
                <input type="text" id="prodCategory" placeholder="hal. Meals">
                <label style="font-size: 12px;">Product Name:</label>
                <input type="text" id="prodName" placeholder="Burger Cheezy">
                <div class="switch-container" style="margin-top: 10px;">
                    <span style="font-size: 13px; font-weight: bold; color: #38bdf8;">🔄 Gamitin ang Variants</span>
                    <label class="switch"><input type="checkbox" id="enableVariantsToggle" onchange="toggleVariantMode()"><span class="slider"></span></label>
                </div>
                <div id="soloItemPricingBox">
                    <div style="display: flex; gap: 10px;">
                        <div style="flex: 1;"><label style="font-size: 12px;">Base Price:</label><input type="number" id="prodPrice" placeholder="99"></div>
                        <div style="flex: 1;"><label style="font-size: 12px;">Promo Discount:</label><input type="number" id="prodDiscount" placeholder="0"></div>
                    </div>
                    <label style="font-size: 12px;">Main Availability:</label>
                    <select id="prodAvailability"><option value="Available">Available</option><option value="In Stock">In Stock</option><option value="Out of Stock">Out of Stock</option></select>
                    <label style="font-size: 12px;">Quantity Available:</label>
                    <input type="number" id="prodQuantity" placeholder="hal. 50">
                </div>
                <div id="variantBuilderBox" style="display: none; background:#0f172a; padding:12px; border-radius:8px; border:1px dashed #38bdf8; margin-bottom:12px;">
                    <label style="font-size: 12px; font-weight: bold; color:#38bdf8;">✨ Multi-Variant Manager:</label>
                    <button type="button" class="btn-blue" onclick="addVariantCard()" style="font-size:12px; padding:8px; margin-bottom:10px;">➕ Magdagdag ng Variant Row</button>
                    <div class="variant-chips-container" id="variantChipsContainer"></div>
                </div>
                <label style="font-size: 12px;">Description:</label>
                <textarea id="prodDesc" rows="2" placeholder="Paglalarawan"></textarea>
                <label style="font-size: 12px;">Main Image Link URL:</label>
                <input type="url" id="prodImage" placeholder="Google Drive Share Link">
                <button class="btn-green" onclick="addMenuItemToSheet()" style="background:#16a34a;">💾 I-save sa Google Sheet</button>
            </div>
            <div class="card">
                <h3 style="margin:0 0 10px 0;">Lista ng mga Item</h3>
                <button class="btn-green" onclick="showAddMenuForm()" style="font-size: 15px; padding: 12px; margin-bottom: 10px; background:#16a34a;">➕ Add New Menu Item</button>
                <div id="sheetItemsContainer" style="max-height: 500px; overflow-y: auto; margin-top: 10px;"></div>
            </div>
        </div>
    </div>
</div>
<script>
    const SUPABASE_URL = "https://qeqbnhpvarsdcrdzpycr.supabase.co";
    const VERIFY_THEME_URL = "https://qeqbnhpvarsdcrdzpycr.supabase.co/functions/v1/verify-and-update-theme";
    const GET_CONFIG_URL = "https://qeqbnhpvarsdcrdzpycr.supabase.co/functions/v1/get-store-config";
    let activeStore = "";
    let activeWebhookUrl = "";
    let activeStorePassword = "";

    function toggleDrawer(){document.body.classList.toggle('drawer-open');}
    function switchTab(tabName){document.getElementById('themeSettingsSection').style.display=tabName==='themeTab'?'block':'none';document.getElementById('reconfigSection').style.display=tabName==='reconfigTab'?'block':'none';document.getElementById('mainMenuSection').style.display=tabName==='menuTab'?'block':'none';toggleDrawer();}
    function protectedAction(targetTab){const inputPwd=prompt("🔑 Pakipasok ang Store Password:");if(inputPwd===null) return;if(inputPwd===activeStorePassword) switchTab(targetTab); else alert("❌ Mali ang Password!");}
    function toggleThemeTypeFields(){const type=document.getElementById("themeBgType").value;document.getElementById("themeColorBox").style.display=type==="color"?"block":"none";document.getElementById("themeImageBox").style.display=type==="image"?"block":"none";}
    function resetThemeToDefault(){document.getElementById("themeStoreLogo").value="";document.getElementById("themePrimaryColor").value="#0284c7";document.getElementById("themePrimaryHex").value="#0284c7";document.getElementById("themeBgType").value="default";document.getElementById("themeBgColor").value="#0f172a";document.getElementById("themeBgHex").value="#0f172a";document.getElementById("themeDriveImage").value="";toggleThemeTypeFields();}
    function convertGoogleDriveLink(rawUrl){if(!rawUrl) return "";rawUrl=rawUrl.trim();const driveRegex=/(?:\/d\/|id=)([a-zA-Z0-9_-]{25,})/;const match=rawUrl.match(driveRegex);if(match&&match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`;return rawUrl;}

    // SECURED LOGIN - via verify-and-update-theme
    async function loginAndLoadMenu(){
        const username=document.getElementById('storeUsername').value.trim().toLowerCase();
        const pwd=document.getElementById('storePassword').value.trim();
        if(!username||!pwd){alert("Pakipunan ang Username at Password!");return;}
        document.getElementById('loginActionBtn').innerText="⏳ Checking...";
        try{
            const res=await fetch(VERIFY_THEME_URL,{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({ username: username, password: pwd, action: "verify" })
            });
            const result=await res.json();
            if(result.error){alert("❌ "+result.error);document.getElementById('loginActionBtn').innerText="Log In & Load Menu";return;}
            
            // Expiry check galing server
            if(result.expiry){
                const today=new Date().toISOString().split('T')[0];
                if(today>result.expiry && result.status!=="ACTIVE"){alert("❌ Expired na! Contact admin.");document.getElementById('loginActionBtn').innerText="Log In & Load Menu";return;}
            }

            activeStore=username;
            activeStorePassword=pwd;
            document.getElementById('activeStoreLabel').innerText="@"+username;
            document.getElementById('loginCard').style.display='none';
            document.getElementById('managerSection').style.display='block';
            await loadStoreSheetUrl();
            await loadStoreThemeSettings();
        }catch(e){console.error(e);alert("Error: "+e.message);document.getElementById('loginActionBtn').innerText="Log In & Load Menu";}
    }

    async function loadStoreSheetUrl(){
        try{
            const res=await fetch(GET_CONFIG_URL,{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({ username: activeStore, page: activeStore })
            });
            const result=await res.json();
            const data=result.data||result;
            if(data&&data.menu_sheet_url){
                activeWebhookUrl=data.menu_sheet_url;
                document.getElementById("sheetWebhookUrl").value=activeWebhookUrl;
                if(activeWebhookUrl) fetchMenuItemsFromSheet();
            }
        }catch(err){console.error(err);}
    }

    async function loadStoreThemeSettings(){
        try{
            const res=await fetch(GET_CONFIG_URL,{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({ username: activeStore, page: activeStore })
            });
            const result=await res.json();
            const data=result.data||result;
            if(data&&data.kiosk_theme_config){
                let theme=typeof data.kiosk_theme_config==="string"?JSON.parse(data.kiosk_theme_config):data.kiosk_theme_config;
                if(theme.storeLogo) document.getElementById("themeStoreLogo").value=theme.storeLogo;
                if(theme.primary){document.getElementById("themePrimaryColor").value=theme.primary;document.getElementById("themePrimaryHex").value=theme.primary;}
                if(theme.bgType){document.getElementById("themeBgType").value=theme.bgType;toggleThemeTypeFields();}
                if(theme.bgColor){document.getElementById("themeBgColor").value=theme.bgColor;document.getElementById("themeBgHex").value=theme.bgColor;}
                if(theme.bgImage) document.getElementById("themeDriveImage").value=theme.bgImage;
            }else{resetThemeToDefault();}
        }catch(e){console.error(e);}
    }

    // SECURED SAVE - gamit https://qeqbnhpvarsdcrdzpycr.supabase.co/functions/v1/verify-and-update-theme
    async function saveStoreThemeSettings(){
        const storeLogo=convertGoogleDriveLink(document.getElementById("themeStoreLogo").value.trim());
        const primary=document.getElementById("themePrimaryHex").value.trim()||"#0284c7";
        const bgType=document.getElementById("themeBgType").value;
        const bgColor=document.getElementById("themeBgHex").value.trim()||"#0f172a";
        const bgImage=convertGoogleDriveLink(document.getElementById("themeDriveImage").value.trim());
        const themeConfig={storeLogo,primary,bgType,bgColor,bgImage};
        try{
            const res=await fetch(VERIFY_THEME_URL,{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({ username: activeStore, password: activeStorePassword, kiosk_theme_config: themeConfig })
            });
            const result=await res.json();
            if(result.error) alert("❌ Bigo: "+result.error);
            else alert("✨ Matagumpay na naisave ang Theme! via verify-and-update-theme");
        }catch(e){alert("Error: "+e.message);}
    }

    async function saveSheetUrlToSupabase(){
        const urlInput=document.getElementById("sheetWebhookUrl").value.trim();
        if(!urlInput){alert("Paki-paste ang Webhook URL!");return;}
        try{
            const res=await fetch(VERIFY_THEME_URL,{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({ username: activeStore, password: activeStorePassword, menu_sheet_url: urlInput })
            });
            const result=await res.json();
            if(result.error) alert("❌ Error: "+result.error);
            else{activeWebhookUrl=urlInput;alert("✅ Naisave via verify-and-update-theme!");if(activeWebhookUrl) fetchMenuItemsFromSheet();}
        }catch(e){alert("Error: "+e.message);}
    }

    function logoutStore(){window.location.reload();}
    function showAddMenuForm(){document.getElementById('menuFormCard').style.display='block';}
    function hideMenuForm(){document.getElementById('menuFormCard').style.display='none';}
    function toggleVariantMode(){const enabled=document.getElementById('enableVariantsToggle').checked;document.getElementById('soloItemPricingBox').style.display=enabled?'none':'block';document.getElementById('variantBuilderBox').style.display=enabled?'block':'none';}
    function addVariantCard(){const c=document.getElementById('variantChipsContainer');const div=document.createElement('div');div.className='variant-chip-card';div.innerHTML=`<input type="text" placeholder="Variant Name"><input type="number" placeholder="Price"><input type="text" placeholder="Status"><input type="number" placeholder="Qty"><button type="button" onclick="this.parentElement.remove()" style="background:#ef4444; padding:6px;">Remove</button>`;c.appendChild(div);}
    async function fetchMenuItemsFromSheet(){if(!activeWebhookUrl) return;try{const res=await fetch(activeWebhookUrl+"?action=GET_ITEMS");const items=await res.json();const container=document.getElementById('sheetItemsContainer');container.innerHTML="";if(!items||items.length===0){container.innerHTML="<p style='text-align:center; color:#94a3b8;'>Walang item</p>";return;}items.forEach(item=>{const div=document.createElement('div');div.className='item-row';div.innerHTML=`<div><b>${item.name}</b><br><small>${item.category||''} | ₱${item.price||0}</small></div><div><span style="font-size:10px; background:#166534; color:#dcfce7; padding:2px 6px; border-radius:4px;">${item.status||'Available'}</span></div>`;container.appendChild(div);});}catch(e){console.error(e);}}
    async function addMenuItemToSheet(){if(!activeWebhookUrl){alert("Wala pang Sheet URL!");return;}const payload={action:"ADD_ITEM",name:document.getElementById('prodName').value,category:document.getElementById('prodCategory').value,productType:document.getElementById('prodType').value,price:document.getElementById('prodPrice').value,description:document.getElementById('prodDesc').value,image:convertGoogleDriveLink(document.getElementById('prodImage').value)};try{await fetch(activeWebhookUrl,{method:'POST',body:JSON.stringify(payload)});alert("✅ Naisave sa Sheet!");fetchMenuItemsFromSheet();hideMenuForm();}catch(e){alert("Error: "+e.message);}}
</script>
</body>
</html>
