<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareMap - Order & Service Gateway v5 + Payment Bottom Drawer</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script>
        const SUPABASE_URL = "https://qeqbnhpvarsdcrdzpycr.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_KwWNvUe_KuZatiWB8nVvkQ_56JRPiif";
        const CREATE_ORDER_URL = "https://qeqbnhpvarsdcrdzpycr.supabase.co/functions/v1/create-order";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let activePageAccessToken = ""; 
        let cachedConversations = []; 
        let isPsidVerifiedFromSuggestion = false; 
        let actualLoggedInPsid = ""; 
        let totalAmountPesos = 0;
        let currentOrdersList = []; 
        let generatedOrderID = "";
        let clickedAtTimestamp = 0; 
        let currentFullNameFromKiosk = "";
        let globalStorePaymentSetup = null;
        let selectedPaymentMethod = "GCash / QR Ph";

        function updateSdkDebugToast(message, isError = false) {
            const toastEl = document.getElementById('debugSdkToast');
            if (toastEl) {
                toastEl.innerText = message;
                toastEl.style.color = isError ? "#f87171" : "#38bdf8";
            }
            console.log("[SDK LOG]:", message);
        }

        function getPageId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('page') || localStorage.getItem('sharemap_page') || "sharemapdammystore";
        }

        function generateSpreadsheetOrderID() {
            const now = new Date();
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const minute = now.getMinutes();
            let letterCode = minute < 26 ? alphabet[minute] : (minute < 52 ? "A" + alphabet[minute - 26] : "B" + alphabet[minute - 52]);
            return `${letterCode}${String(now.getSeconds()).padStart(2, '0')[0]}${String(now.getMilliseconds()).padStart(3, '0')[0]}`;
        }

        async function checkShareMapAccess(pageId) {
            try {
                updateSdkDebugToast("⏳ Verifying store license via Edge Function...");
                
                const res = await fetch(`${SUPABASE_URL}/functions/v1/get-store-config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: pageId.toLowerCase(), page: pageId.toLowerCase() })
                });
                
                const result = await res.json();
                const data = result.data || result;
                const today = new Date().toISOString().split('T')[0];

                if (result.error || !data) {
                    showBlockScreen("⚠️ Walang Lisensya / Inactive Account", `Ang store username na "@${pageId}" ay wala pang lisensya sa ShareMap.`);
                    return;
                }

                if (data.status === "INACTIVE") {
                    showBlockScreen("⚠️ Inactive Account", "Ang store na ito ay kasalukuyang inactive sa ShareMap system.");
                    return;
                }

                if (data.expiry && today > data.expiry && data.status !== "ACTIVE") {
                    showBlockScreen("🚫 Expired License", `Ang inyong subscription ay nag-expire noong ${data.expiry}. Paki-renew ang iyong access.`);
                    return;
                }

                if (data.store_payment_setup) {
                    globalStorePaymentSetup = typeof data.store_payment_setup === 'string' 
                        ? JSON.parse(data.store_payment_setup) 
                        : data.store_payment_setup;
                    loadAndRenderPaymentOptions(globalStorePaymentSetup);
                } else {
                    loadAndRenderPaymentOptions(null);
                }

                if (data.page_access_token && data.page_access_token !== "OFFLINE_TOKEN_EXPIRED") {
                    activePageAccessToken = data.page_access_token;
                    document.getElementById('debugToken').value = "SUCCESS: Nakuha ang Token (" + activePageAccessToken.substring(0, 10) + "...)";
                    updateSdkDebugToast("✅ Store license verified & token loaded.");
                    fetchMetaConversations();
                } else {
                    if (data.status === "ACTIVE" || data.username) {
                        document.getElementById('debugToken').value = "WARNING: Active ang store pero walang page token.";
                        updateSdkDebugToast("⚠️ Active ang store pero walang page token.");
                        window.hasValidPageToken = false;
                        isPsidVerifiedFromSuggestion = true;
                        document.getElementById('displayPsid').value = "MESSENGER_WEB_USER";
                    } else {
                        showBlockScreen("⚠️ Error sa Token", "Walang active token o lisensya ang Store POS na ito.");
                    }
                }

                const urlParams = new URLSearchParams(window.location.search);
                const oidFromUrl = urlParams.get('oid');
                if (oidFromUrl) {
                    generatedOrderID = oidFromUrl;
                    clickedAtTimestamp = urlParams.get('clicked_at') || localStorage.getItem('sharemap_clicked_at') || Date.now();
                    currentFullNameFromKiosk = urlParams.get('fn') || "";
                    actualLoggedInPsid = urlParams.get('psid') || "";
                    document.getElementById("orderIdBadge").innerText = `🔢 Order ID: #${generatedOrderID} (from Kiosk)`;
                } else {
                    generatedOrderID = generateSpreadsheetOrderID();
                    document.getElementById("orderIdBadge").innerText = `🔢 Order ID: #${generatedOrderID}`;
                }
                updatePreview();

            } catch (err) {
                console.error("Verification error:", err);
                updateSdkDebugToast("❌ Connection Error sa Server", true);
                showBlockScreen("⚠️ Connection Error", "Hindi makakonekta sa ShareMap Server. Paki-check ang iyong internet connection.");
            }
        }

        function loadAndRenderPaymentOptions(pSetup) {
            const p2pSelect = document.getElementById('p2pSpinnerSelect');
            let activeMethodsList = [];

            if (pSetup && pSetup.p2p_methods && pSetup.p2p_methods.length > 0) {
                activeMethodsList = pSetup.p2p_methods.filter(p => p.is_active === true);
            }

            p2pSelect.innerHTML = `<option value="" disabled selected>-- choose P2P E-wallet Qrcode provider --</option>`;

            if (activeMethodsList.length > 0) {
                activeMethodsList.forEach((method) => {
                    const opt = document.createElement('option');
                    opt.value = method.name;
                    opt.innerText = `P2P ${method.name} Wallet`;
                    p2pSelect.appendChild(opt);
                });
            }
        }

        function selectMainPaymentType(type, customName = "") {
            document.getElementById('radioP2p').checked = (type === 'p2p');
            document.getElementById('radioQrph').checked = (type === 'qrph');
            document.getElementById('radioCod').checked = (type === 'cod');
            document.getElementById('radioCounter').checked = (type === 'counter');

            if (type === 'p2p') {
                const spinnerVal = customName || document.getElementById('p2pSpinnerSelect').value;
                selectedPaymentMethod = spinnerVal ? `P2P ${spinnerVal} Wallet` : 'P2P E-Wallet (Unselected)';
            } else if (type === 'qrph') {
                const spinnerVal = customName || document.getElementById('qrphSpinnerSelect').value;
                selectedPaymentMethod = spinnerVal ? spinnerVal : 'QRPh / Bank Transfer (Unselected)';
            } else if (type === 'cod') {
                selectedPaymentMethod = 'Cash on Delivery';
            } else if (type === 'counter') {
                selectedPaymentMethod = 'Cash Over the Counter';
            }
            
            // I-update ang summary view sa labas
            document.getElementById('selectedPaymentSummaryText').innerText = selectedPaymentMethod;
        }

        function handleP2pSpinnerChange(val) {
            selectMainPaymentType('p2p', val);
        }

        function handleQrphSpinnerChange(val) {
            selectMainPaymentType('qrph', val);
        }

        function showBlockScreen(title, message) {
            const CONTACT_LINK = "https://m.me/sharemap.digital.address"; 
            document.body.innerHTML = `
                <div style="background:#0f172a; color:#fff; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; font-family:sans-serif;">
                    <div style="background:#1e293b; padding:30px; border-radius:12px; border:1px solid #ef4444; max-width:400px; width:90%;">
                        <h2 style="color:#ef4444; margin-top:0; font-size:20px;">${title}</h2>
                        <p style="color:#cbd5e1; font-size:14px; line-height:1.5;">${message}</p>
                        <a href="${CONTACT_LINK}" target="_blank" style="display:inline-block; margin-top:15px; background:#2563eb; color:#fff; text-decoration:none; padding:12px 24px; border-radius:8px; font-weight:bold; font-size:14px; width:80%;">💬 Contact Developer / Renew Access</a>
                        <hr style="border:0; border-top:1px solid #334155; margin:25px 0 15px 0;">
                        <p style="font-size:11px; color:#94a3b8; margin:0;">ShareMap Licensing Protection &copy; 2026</p>
                    </div>
                </div>
            `;
        }

        function updatePreview() {
            const urlParams = new URLSearchParams(window.location.search);
            document.getElementById('pOrder').innerText = generatedOrderID || urlParams.get('oid') || "-";
            document.getElementById('pPsid').innerText = actualLoggedInPsid || urlParams.get('psid') || document.getElementById('displayPsid').value || "-";
            document.getElementById('pName').innerText = currentFullNameFromKiosk || urlParams.get('fn') || document.getElementById('fullName').value || "-";
            document.getElementById('pClicked').innerText = clickedAtTimestamp ? new Date(parseInt(clickedAtTimestamp)).toLocaleString() : "-";
            
            if (actualLoggedInPsid || urlParams.get('psid')) {
                const psidVal = actualLoggedInPsid || urlParams.get('psid');
                document.getElementById('displayPsid').value = psidVal;
                document.getElementById('profileNameDisplay').innerText = currentFullNameFromKiosk || urlParams.get('fn') || "";
                document.getElementById('psidStatus').innerText = `✅ Verified Account`; 
                document.getElementById('fullName').value = currentFullNameFromKiosk || urlParams.get('fn') || document.getElementById('fullName').value;
                actualLoggedInPsid = psidVal; 
                isPsidVerifiedFromSuggestion = true;
            }
        }

        async function fetchMetaConversations() {
            if (!activePageAccessToken) return;
            try {
                const response = await fetch(`https://graph.facebook.com/v26.0/me/conversations?fields=participants&access_token=${activePageAccessToken}`);
                const result = await response.json();
                if (result.data) { 
                    cachedConversations = []; 
                    result.data.forEach(conv => { 
                        if (conv.participants && conv.participants.data) { 
                            conv.participants.data.forEach(p => cachedConversations.push({name: p.name, psid: p.id})); 
                        } 
                    }); 
                }
            } catch(err) {}
        }

        function handleFullNameInput(query) {
            const container = document.getElementById("suggestionBox");
            const notFoundInd = document.getElementById("notFoundIndicator");
            const cleanQuery = query.trim().toLowerCase();
            
            if (activePageAccessToken && window.hasValidPageToken !== false) {
                isPsidVerifiedFromSuggestion = false;
            }

            if (!cleanQuery) {
                container.style.display = "none";
                notFoundInd.style.display = "none";
                return;
            }

            if (!activePageAccessToken || window.hasValidPageToken === false) {
                container.style.display = "none";
                notFoundInd.innerHTML = "⚠️ Reminder: Ang store na ito ay offline o walang active POS ngayon. Ang iyong order ay diretso lamang sa chat.";
                notFoundInd.style.display = "block";
                return;
            }

            const matches = cachedConversations.filter(item => item.name && item.name.toLowerCase().includes(cleanQuery));
            if (matches.length > 0) {
                notFoundInd.style.display = "none";
                container.innerHTML = "";
                matches.forEach(match => {
                    const div = document.createElement("div");
                    div.className = "suggestion-item";
                    div.innerHTML = `💬 <b>${match.name}</b>`;
                    div.onclick = function() { selectMatchSuggestion(match.name, match.psid); };
                    container.appendChild(div);
                });
                container.style.display = "block";
            } else {
                container.style.display = "none";
            }
        }

        function selectMatchSuggestion(name, chosenPsid) {
            document.getElementById('fullName').value = name;
            document.getElementById('displayPsid').value = chosenPsid;
            localStorage.setItem('sharemap_psid', chosenPsid);
            isPsidVerifiedFromSuggestion = true;
            document.getElementById("suggestionBox").style.display = "none";
            updatePreview();
        }
    </script>
    
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; margin: 0; padding: 15px 12px 30px 12px; box-sizing: border-box; }
        .card { background: #1e293b; padding: 18px 16px; border-radius: 12px; text-align: center; max-width: 420px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.3); box-sizing: border-box; }
        .store-badge { background: #0284c7; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 8px; }
        .order-id-badge { background: #0f172a; border: 1px dashed #38bdf8; padding: 8px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; color: #38bdf8; font-weight: bold; }
        .info-box { background: #0f172a; border: 1px solid #38bdf8; padding: 10px; border-radius: 8px; margin-bottom: 12px; text-align: left; font-size: 12px; }
        
        .service-toggle { display: flex; background: #0f172a; padding: 4px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
        .service-option { flex: 1; text-align: center; }
        .service-option input[type="radio"] { display: none; }
        .service-option label { display: block; padding: 8px 4px; font-size: 11px; font-weight: bold; color: #94a3b8; border-radius: 6px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .service-option input[type="radio"]:checked + label { background-color: #0284c7; color: #ffffff; }

        .form-group { text-align: left; margin-bottom: 10px; position: relative; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 3px; color: #cbd5e1; }
        .form-group input { width: 100%; padding: 9px; border: 1px solid #475569; border-radius: 6px; background-color: #0f172a; color: #ffffff; font-size: 14px; box-sizing: border-box; outline: none; }
        
        .suggestion-box { position: absolute; top: 100%; left: 0; right: 0; background: #0f172a; border: 1px solid #0284c7; border-radius: 6px; max-height: 150px; overflow-y: auto; z-index: 100; display: none; box-shadow: 0 6px 12px rgba(0,0,0,0.5); }
        .suggestion-item { padding: 10px; font-size: 13px; color: #f8fafc; border-bottom: 1px solid #1e293b; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .not-found-text { color: #f87171; font-size: 11px; margin-top: 4px; display: none; font-weight: bold; }

        .order-section { text-align: left; margin-top: 15px; margin-bottom: 15px; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
        .btn-add-order { background-color: #16a34a; color: #ffffff; border: none; padding: 10px; font-size: 13px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .item-row { display: flex; align-items: center; gap: 5px; margin-bottom: 8px; background: #1e293b; padding: 6px; border-radius: 6px; border: 1px solid #475569; }
        .act-btn { padding: 6px 8px; border: none; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .btn-edit { background: #eab308; color: #000; } 
        .btn-del { background: #ef4444; color: white; }
        .saved-text { flex: 1; font-size: 13px; color: #f8fafc; word-break: break-word; }
        
        .btn { background-color: #0284c7; color: #ffffff; border: none; padding: 12px 20px; font-size: 0.95rem; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 8px; }
        .error-msg { color: #f87171; font-size: 12px; margin-top: 6px; display: none; }
        .qr-display-box { background: #ffffff; padding: 15px; border-radius: 12px; display: inline-block; margin-top: 10px; }
        .total-amount-badge { background: #064e3b; color: #34d399; border: 1px solid #10b981; padding: 10px; border-radius: 8px; font-size: 16px; font-weight: bold; margin-bottom: 12px; }

        /* Lazada Style Payment Summary Box sa Main Screen */
        .payment-summary-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-bottom: 12px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        
        /* Bottom Drawer para sa Payment Method */
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: flex-end; flex-direction: column; z-index: 2500; }
        .bottom-drawer { background: #1e293b; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 20px; max-height: 85vh; overflow-y: auto; border-top: 2px solid #38bdf8; box-sizing: border-box; width: 100%; max-width: 480px; margin: 0 auto; text-align: left; }
        .drawer-handle { width: 40px; height: 5px; background: #64748b; border-radius: 3px; margin: 0 auto 15px auto; }
        
        .payment-row { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .payment-row input[type="radio"] { accent-color: #0284c7; width: 16px; height: 16px; }
        .payment-row select { flex: 1; padding: 6px 8px; background: #1e293b; color: #fff; border: 1px solid #38bdf8; border-radius: 6px; font-size: 12px; font-weight: bold; outline: none; }
    </style>
</head>
<body>

    <div class="card">
        <div id="storeUsernameDisplay" class="store-badge">@store</div>
        <h3 style="margin: 0 0 4px 0;">📍 ShareMap Ordering Gateway</h3>
        <div id="orderIdBadge" class="order-id-badge">🔢 Order ID: GENERATING...</div>

        <!-- DEBUG TOAST BOX -->
        <div style="background: #0f172a; padding: 6px; border-radius: 6px; border: 1px solid #0284c7; margin-bottom: 8px; text-align: left;">
            <label style="font-size: 10px; color: #94a3b8; display: block;">🛠️ System Status:</label>
            <div id="debugSdkToast" style="font-size: 11px; font-weight: bold; color: #e2e8f0; word-break: break-all;">Ready...</div>
        </div>

        <!-- PREVIEW INFO BOX -->
        <div class="info-box">
            <div>🔢 Order #: <b id="pOrder">-</b></div>
            <div>🔒 PSID: <b id="pPsid">-</b></div>
            <div>👤 Name: <b id="pName">-</b></div>
            <div>⏰ Clicked At: <b id="pClicked">-</b></div>
        </div>

        <!-- PROFILE PIC & STATUS DISPLAY -->
        <div style="text-align:center; margin-bottom:12px;">
            <img id="profilePic" src="https://via.placeholder.com/80?text=FB" style="width:80px; height:80px; border-radius:50%; border:3px solid #38bdf8; object-fit:cover;" />
            <div id="profileNameDisplay" style="font-size:13px; font-weight:bold; color:#38bdf8; margin-top:5px;"></div>
            <div id="psidStatus" style="font-size:10px; color:#94a3b8;">Waiting...</div>
        </div>

        <div class="service-toggle">
            <div class="service-option"><input type="radio" id="typeDelivery" name="serviceType" value="delivery" checked onchange="toggleServiceType()"><label for="typeDelivery">🛵 Delivery</label></div>
            <div class="service-option"><input type="radio" id="typeDineIn" name="serviceType" value="dinein" onchange="toggleServiceType()"><label for="typeDineIn">🍽️ Dine-In</label></div>
            <div class="service-option"><input type="radio" id="typeCounter" name="serviceType" value="counter" onchange="toggleServiceType()"><label for="typeCounter">💳 Counter</label></div>
        </div>

        <!-- Supabase Token Debugger Field (Green Box) -->
        <div class="form-group" style="background: #064e3b; padding: 6px; border-radius: 6px; border: 1px solid #10b981; margin-bottom: 8px;">
            <label style="font-size: 10px; color: #34d399; margin-bottom: 2px;">🟢 Supabase Token Status:</label>
            <input type="text" id="debugToken" readonly style="background: transparent; border: none; color: #ecfdf5; font-size: 11px; font-weight: bold; padding: 2px 0;" value="Checking Supabase Edge Function...">
        </div>

        <div class="form-group"><label>🔒 PSID:</label><input type="text" id="displayPsid" readonly style="background:transparent; border:none; color:#cbd5e1; font-size:12px; font-weight:bold;" value="MESSENGER_WEB_USER"></div>
        <div class="form-group"><label>👤 Facebook Full Name:</label><input type="text" id="fullName" placeholder="Auto-fill..." autocomplete="off" oninput="handleFullNameInput(this.value)"><div id="notFoundIndicator" class="not-found-text"></div><div id="suggestionBox" class="suggestion-box"></div></div>
        <div class="form-group"><label>📞 Contact:</label><input type="tel" id="phone" placeholder="09123456789" autocomplete="off"></div>
        <div class="form-group" id="landmarkGroup"><label>🏠 Landmark:</label><input type="text" id="landmark" placeholder="Tabi ng Store" autocomplete="off"></div>
        <div class="form-group" id="tableGroup" style="display:none;"><label>🪑 Table:</label><input type="text" id="tableNum" placeholder="Table 5" autocomplete="off"></div>
        <div class="form-group" id="paxGroup" style="display:none;"><label>👥 Pax:</label><input type="number" id="paxCount" value="2"></div>
        <div class="form-group" id="scheduleGroup"><label>⏰ Schedule:</label><input type="datetime-local" id="scheduleOrder"></div>

        <!-- LAZADA STYLE PAYMENT METHODS COMPACT PREVIEW & VIEW ALL METHODS BUTTON -->
        <div class="payment-summary-box">
            <div>
                <div style="font-size: 10px; color: #94a3b8; font-weight: bold;">Payment Method</div>
                <div id="selectedPaymentSummaryText" style="font-size: 13px; color: #38bdf8; font-weight: bold; margin-top: 2px;">GCash / QR Ph</div>
            </div>
            <button type="button" onclick="openPaymentDrawer()" style="background: none; border: none; color: #38bdf8; font-size: 12px; font-weight: bold; cursor: pointer; text-decoration: underline;">View all methods ></button>
        </div>

        <div class="order-section">
            <div id="totalPriceDisplay" class="total-amount-badge">💰 Total: ₱<span id="grandTotalText">0.00</span></div>
            <button type="button" class="btn-add-order" onclick="openKioskMenu()">🍔 ➕ Magdagdag / Palitan ang Order (Kiosk Mode)</button>
            <div id="orderListContainer"></div>
        </div>

        <p id="errorMsg" class="error-msg"></p>
        <button id="proceedBtn" class="btn">📍 Sunod: Pumili ng Payment & Kunin ang GPS ➔</button>

        <div id="counterQrContainer" style="display:none; margin-top:15px; background:#0f172a; padding:15px; border-radius:8px; border:1px solid #38bdf8;">
            <div class="qr-display-box" id="qrcodeCanvas"></div>
            <p id="qrTextDetail" style="font-size:13px; font-weight:bold; color:#38bdf8; margin-top:10px;"></p>
            <button type="button" class="btn" style="background-color:#16a34a; margin-top:12px;" onclick="openPaymentDrawerForCounter()">💳 Pumili ng Payment & I-send sa POS ➔</button>
        </div>
    </div>

    <!-- PAYMENT METHOD BOTTOM DRAWER (Lazada Style Full Options) -->
    <div id="paymentDrawer" class="drawer-overlay" onclick="closePaymentDrawer(event)">
        <div class="bottom-drawer" onclick="event.stopPropagation()">
            <div class="drawer-handle"></div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="margin: 0; color: #38bdf8; font-size: 15px;">💳 Select Payment Method</h3>
                <button onclick="closePaymentDrawerDirect()" style="background: #ef4444; color: white; border: none; padding: 5px 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px;">✕</button>
            </div>
            
            <!-- 1. P2P E-WALLET METHOD (Radio + Clickable Spinner Inline) -->
            <div class="payment-row" onclick="selectMainPaymentType('p2p')">
                <input type="radio" name="payMethodMain" id="radioP2p" value="P2P" checked>
                <select id="p2pSpinnerSelect" onchange="handleP2pSpinnerChange(this.value)" onclick="event.stopPropagation(); selectMainPaymentType('p2p');">
                    <option value="" disabled selected>-- choose P2P E-wallet Qrcode provider --</option>
                </select>
            </div>

            <!-- 2. QRPH / BANK TRANSFER METHOD (Radio + Clickable Spinner Inline) -->
            <div class="payment-row" onclick="selectMainPaymentType('qrph')">
                <input type="radio" name="payMethodMain" id="radioQrph" value="QRPh">
                <select id="qrphSpinnerSelect" onchange="handleQrphSpinnerChange(this.value)" onclick="event.stopPropagation(); selectMainPaymentType('qrph');">
                    <option value="" disabled selected>-- choose E-wallet QRPh or / Bank transfer --</option>
                    <option value="Merchant QR / QRPh">1) Generate Merchant Qrcode / QRPh o InstaPay PayMongo</option>
                    <option value="Online Bank Transfer">2) Online Bank Transfer PayMongo</option>
                </select>
            </div>

            <!-- 3. CASH ON DELIVERY -->
            <div class="payment-row" id="codDrawerRow" onclick="selectMainPaymentType('cod')">
                <input type="radio" name="payMethodMain" id="radioCod" value="COD">
                <span style="font-size: 13px; font-weight: bold; color: #fff;">🛵 Cash on Delivery (COD)</span>
            </div>

            <!-- 4. CASH OVER THE COUNTER -->
            <div class="payment-row" onclick="selectMainPaymentType('counter')">
                <input type="radio" name="payMethodMain" id="radioCounter" value="Counter">
                <span style="font-size: 13px; font-weight: bold; color: #fff;">💵 Cash Over the Counter</span>
            </div>

            <button type="button" class="btn" style="background-color: #16a34a; margin-top: 15px;" onclick="closePaymentDrawerDirect()">✅ Confirm Selection ➔</button>
        </div>
    </div>

<script>
function toggleServiceType(){
    const isDelivery = document.getElementById("typeDelivery").checked; 
    const isDineIn = document.getElementById("typeDineIn").checked; 
    const isCounter = document.getElementById("typeCounter").checked;
    
    document.getElementById("landmarkGroup").style.display = isDelivery ? "block" : "none"; 
    document.getElementById("tableGroup").style.display = isDineIn ? "block" : "none";
    document.getElementById("paxGroup").style.display = isDineIn ? "block" : "none"; 
    document.getElementById("scheduleGroup").style.display = isCounter ? "none" : "block";
    document.getElementById("proceedBtn").style.display = isCounter ? "none" : "block"; 
    document.getElementById("counterQrContainer").style.display = isCounter ? "block" : "none";
    
    // Itago o ipakita ang COD row sa drawer base kung Delivery o hindi
    const codDrawerRow = document.getElementById('codDrawerRow');
    if(codDrawerRow) codDrawerRow.style.display = isDelivery ? "flex" : "none";

    if (isDelivery) {
        proceedBtn.innerText = "📍 Sunod: Pumili ng Payment & Kunin ang GPS ➔";
    } else if (isDineIn) {
        proceedBtn.innerText = "📩 Pumili ng Payment & I-send ang Dine-In Order ➔";
    }

    if(isCounter) generateCounterQr();
}

function openPaymentDrawer(){
    const nameVal = document.getElementById('fullName').value.trim(); 
    const phoneVal = document.getElementById('phone').value.trim();
    if(!nameVal || !phoneVal){ 
        document.getElementById('errorMsg').innerText = "⚠️ Paki-fillup ang Pangalan at Contact Number bago magpatuloy."; 
        document.getElementById('errorMsg').style.display = "block"; 
        return; 
    }
    document.getElementById('errorMsg').style.display = "none";
    document.getElementById('paymentDrawer').style.display = 'flex';
}

function openPaymentDrawerForCounter(){
    openPaymentDrawer();
}

function closePaymentDrawer(e){
    if(!e || e.target.id === 'paymentDrawer'){
        document.getElementById('paymentDrawer').style.display = 'none';
    }
}
function closePaymentDrawerDirect(){
    document.getElementById('paymentDrawer').style.display = 'none';
}

function confirmAndExecuteCheckout(){
    closePaymentDrawerDirect();
    const isCounter = document.getElementById("typeCounter").checked;
    const isDineIn = document.getElementById("typeDineIn").checked;

    if(isCounter){
        handleCounterCheckoutSequence();
    } else if(isDineIn){
        handleProcessOrder();
    } else {
        handleProcessOrder(); 
    }
}

function openKioskMenu(){ 
    const pageId = getPageId(); 
    const psid = document.getElementById('displayPsid').value || actualLoggedInPsid || ""; 
    const fn = document.getElementById('fullName').value || currentFullNameFromKiosk || "";
    const ordText = getFormattedOrdersText();
    const totalText = totalAmountPesos ? totalAmountPesos.toFixed(2) : "0.00";
    const typeVal = document.getElementById('typeDelivery').checked ? 'delivery' : (document.getElementById('typeDineIn').checked ? 'dinein' : 'counter');
    
    let cartObj = {};
    if(currentOrdersList && currentOrdersList.length > 0){
        currentOrdersList.forEach(o => { cartObj[o.name] = o.qty; });
    }
    const cartJsonToSend = Object.keys(cartObj).length > 0 ? encodeURIComponent(JSON.stringify(cartObj)) : "";
    
    if(psid) localStorage.setItem('sharemap_psid', psid);
    if(fn) localStorage.setItem('sharemap_fullname', fn);
    localStorage.setItem('sharemap_orderid', generatedOrderID);
    localStorage.setItem('sharemap_clicked_at', clickedAtTimestamp);
    
    window.location.href = `./kioskmode.html?page=${encodeURIComponent(pageId)}&psid=${encodeURIComponent(psid)}&fn=${encodeURIComponent(fn)}&oid=${encodeURIComponent(generatedOrderID)}&clicked_at=${clickedAtTimestamp}&ord=${encodeURIComponent(ordText)}&total=${encodeURIComponent(totalText)}&type=${encodeURIComponent(typeVal)}&cart=${cartJsonToSend}`;
}

function setupBackButtonTrayReturn(){
    history.pushState({tray: true, oid: generatedOrderID}, "", location.href);
    window.addEventListener('popstate', function(e){
        openKioskMenu();
    });
}

function renderOrderUI(){
    const container = document.getElementById("orderListContainer"); 
    container.innerHTML = "";
    if(currentOrdersList.length === 0){ 
        container.innerHTML = `<p style="font-size:12px; color:#94a3b8; text-align:center;">Walang order.</p>`; 
        document.getElementById('grandTotalText').innerText = "0.00"; 
        return; 
    }
    currentOrdersList.forEach((item, index)=>{ 
        let row = document.createElement("div"); 
        row.className = "item-row"; 
        row.innerHTML = `<span class="saved-text"><b>${item.name}</b> x${item.qty}</span><button type="button" class="act-btn btn-edit" onclick="editOrderQty(${index})">✏️ Edit</button><button type="button" class="act-btn btn-del" onclick="deleteOrderItem(${index})">🗑️</button>`; 
        container.appendChild(row); 
    });
    document.getElementById('grandTotalText').innerText = totalAmountPesos.toFixed(2); 
    
    let summaryText = currentOrdersList.map(i => `${i.name} x${i.qty}`).join(', ');
    localStorage.setItem('sharemap_orders', summaryText);

    if(document.getElementById("typeCounter").checked) generateCounterQr();
}

function editOrderQty(index){ 
    let current = currentOrdersList[index]; 
    let newQty = prompt(`Bagong quantity:`, current.qty); 
    if(newQty !== null){ 
        let parsed = parseInt(newQty); 
        if(!isNaN(parsed) && parsed > 0){ 
            currentOrdersList[index].qty = parsed; 
            renderOrderUI(); 
        } else if(parsed === 0){ 
            currentOrdersList.splice(index, 1); 
            renderOrderUI(); 
        } 
    } 
}

function deleteOrderItem(index){ 
    currentOrdersList.splice(index, 1); 
    renderOrderUI(); 
}

function getFormattedOrdersText(){ 
    if(currentOrdersList.length === 0) return "Walang order"; 
    return currentOrdersList.map(i => `${i.name} x${i.qty}`).join(', '); 
}

function formatScheduleText(rawInput){ 
    if(!rawInput) return "Now (Agad-agad)"; 
    const dt = new Date(rawInput); 
    if(isNaN(dt.getTime())) return rawInput; 
    return dt.toLocaleString('en-PH', {dateStyle:'medium', timeStyle:'short'}); 
}

function generateCounterQr(){ 
    const qrCanvasContainer = document.getElementById("qrcodeCanvas"); 
    qrCanvasContainer.innerHTML = ""; 
    const activePsid = document.getElementById('displayPsid').value; 
    const ordersVal = getFormattedOrdersText(); 
    const nameVal = document.getElementById('fullName').value.trim() || "Customer"; 
    const qrPayload = JSON.stringify({oid: generatedOrderID, psid: activePsid, name: nameVal, orders: ordersVal, total: totalAmountPesos, clicked_at: clickedAtTimestamp, payment: selectedPaymentMethod}); 
    new QRCode(qrCanvasContainer, {text: qrPayload, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.H}); 
    document.getElementById("qrTextDetail",).innerText = `Order ID: #${generatedOrderID} | Pay: ${selectedPaymentMethod} | ₱${totalAmountPesos.toFixed(2)}`; 
}

function downloadQrCodeImageWithDetails(){
    const qrContainer = document.getElementById("qrcodeCanvas"); 
    const originalCanvas = qrContainer.querySelector("canvas"); 
    const pageId = getPageId();
    if(!originalCanvas){ generateCounterQr(); return; }
    const exportCanvas = document.createElement("canvas"); 
    const ctx = exportCanvas.getContext("2d"); 
    const padding = 20; 
    const textSpace = 120;
    exportCanvas.width = originalCanvas.width + (padding * 2); 
    exportCanvas.height = originalCanvas.height + (padding * 2) + textSpace;
    ctx.fillStyle = "#FFFFFF"; 
    ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height); 
    ctx.drawImage(originalCanvas, padding, padding);
    ctx.fillStyle = "#000000"; 
    ctx.font = "bold 15px Arial"; 
    ctx.textAlign = "center"; 
    let currentY = originalCanvas.height + padding + 22;
    ctx.fillText(`Store: @${pageId.toLowerCase()}`, exportCanvas.width / 2, currentY); 
    currentY += 20; 
    ctx.font = "bold 16px Arial"; 
    ctx.fillText(`Order ID: #${generatedOrderID}`, exportCanvas.width / 2, currentY);
    currentY += 18; 
    ctx.font = "12px Arial";
    ctx.fillText(`Payment: ${selectedPaymentMethod}`, exportCanvas.width / 2, currentY);
    currentY += 18; 
    ctx.font = "11px Arial"; 
    ctx.fillStyle = "#475569"; 
    const nowStr = new Date().toLocaleString('en-PH', {dateStyle:'medium', timeStyle:'short'}); 
    ctx.fillText(`Generated: ${nowStr}`, exportCanvas.width / 2, currentY);
    currentY += 22; 
    ctx.font = "bold 14px Arial"; 
    ctx.fillStyle = "#16a34a"; 
    ctx.fillText(`Total: ₱${totalAmountPesos.toFixed(2)}`, exportCanvas.width / 2, currentY);
    
    const imageUri = exportCanvas.toDataURL("image/png"); 
    const link = document.createElement("a"); 
    link.href = imageUri; 
    link.download = `${pageId.toLowerCase()}_Order_${generatedOrderID}.png`; 
    document.body.appendChild(link); 
    link.click(); 
    document.body.removeChild(link);
}

function copyTextToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(err => {});
    } else {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        try { document.execCommand('copy'); } catch (err) {}
        document.body.removeChild(textarea);
    }
}

// === OVER-THE-COUNTER DIRECT FETCH ===
async function handleCounterCheckoutSequence(){
    const nameVal = document.getElementById('fullName').value.trim(); 
    const phoneVal = document.getElementById('phone').value.trim();
    const ordersVal = getFormattedOrdersText(); 
    const pageId = getPageId(); 
    const activePsid = document.getElementById('displayPsid').value;
    
    downloadQrCodeImageWithDetails();
    
    const formattedOrders = ordersVal.split(', ').join('\n'); 
    const shareText = `💳 OVER-THE-COUNTER ADVANCE ORDER\npsid: ${activePsid}\n🔢 Order ID: #${generatedOrderID}\n🏪 Store: ${pageId}\n💳 Payment Method: ${selectedPaymentMethod}\n⏰ Clicked At: ${clickedAtTimestamp ? new Date(parseInt(clickedAtTimestamp)).toLocaleString() : new Date().toLocaleString()}\n💰 Total: ₱${totalAmountPesos.toFixed(2)}\n\n🛒 Orders:\n${formattedOrders}\n\n👤 Name: ${nameVal}\n📞 Contact: ${phoneVal}`;
    
    copyTextToClipboard(shareText);

    try {
        await fetch(CREATE_ORDER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                order_id: generatedOrderID,
                store_page: pageId.toLowerCase(),
                branch: `Counter (${selectedPaymentMethod})`,
                schedule: "Over-the-Counter",
                customer_name: nameVal,
                customer_phone: phoneVal,
                landmark: `Payment: ${selectedPaymentMethod} | Total: ₱${totalAmountPesos.toFixed(2)}`,
                orders_list: formattedOrders,
                plus_code: "COUNTER",
                latitude: 0,
                longitude: 0,
                raw_chat_output: shareText,
                messenger_psid: activePsid || "MESSENGER_WEB_USER",
                clicked_at: clickedAtTimestamp || Date.now(),
                status: 'PENDING'
            })
        });
    } catch (err) {}
    
    const messengerUrl = `https://m.me/${encodeURIComponent(pageId)}?text=${encodeURIComponent(shareText)}`; 
    setTimeout(()=>{ window.location.href = messengerUrl; }, 1000);
}

// === DINE-IN / DELIVERY CHECKOUT ===
async function handleProcessOrder(){
    const nameVal = document.getElementById('fullName').value.trim(); 
    const phoneVal = document.getElementById('phone').value.trim();
    const landmarkVal = document.getElementById('landmark').value.trim(); 
    const tableVal = document.getElementById('tableNum').value.trim();
    const paxVal = document.getElementById('paxCount').value.trim(); 
    const schedVal = document.getElementById('scheduleOrder').value;
    const ordersVal = getFormattedOrdersText(); 
    const isDineIn = document.getElementById("typeDineIn").checked; 
    const pageId = getPageId(); 
    const activePsid = document.getElementById('displayPsid').value;
    
    if(!nameVal || !phoneVal){ 
        document.getElementById('errorMsg').innerText = "⚠️ Paki-fillup ang Pangalan at Contact Number bago magpatuloy."; 
        document.getElementById('errorMsg').style.display = "block"; 
        return; 
    }
    document.getElementById('errorMsg').style.display = "none"; 
    const formattedSched = formatScheduleText(schedVal);
    
    if(isDineIn){
        const formattedOrders = ordersVal.split(', ').join('\n• '); 
        const shareText = `🍽️ DINE-IN TABLE RESERVATION\npsid: ${activePsid}\n🔢 Order ID: #${generatedOrderID}\n🏪 Store: ${pageId}\n💳 Payment Method: ${selectedPaymentMethod}\n⏰ Clicked At: ${clickedAtTimestamp ? new Date(parseInt(clickedAtTimestamp)).toLocaleString() : new Date().toLocaleString()}\n🪑 Table: ${tableVal || 'Not Specified'}\n⏰ Schedule: ${formattedSched}\n👥 Party Size: ${paxVal || '2'} Pax\n💰 Total: ₱${totalAmountPesos.toFixed(2)}\n\n🛒 Advance Orders:\n• ${formattedOrders}\n\n👤 Name: ${nameVal}\n📞 Contact: ${phoneVal}`;
        
        copyTextToClipboard(shareText);

        try {
            await fetch(CREATE_ORDER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    order_id: generatedOrderID,
                    store_page: pageId.toLowerCase(),
                    branch: `Table: ${tableVal || 'Not Specified'} (${selectedPaymentMethod})`,
                    schedule: formattedSched,
                    customer_name: nameVal,
                    customer_phone: phoneVal,
                    landmark: `Dine-In Table ${tableVal || 'N/A'} | Pay: ${selectedPaymentMethod}`,
                    orders_list: ordersVal,
                    plus_code: "DINE-IN",
                    latitude: 0,
                    longitude: 0,
                    raw_chat_output: shareText,
                    messenger_psid: activePsid || "MESSENGER_WEB_USER",
                    clicked_at: clickedAtTimestamp || Date.now(),
                    status: 'PENDING'
                })
            });
        } catch (err) {}
        
        const messengerUrl = `https://m.me/${encodeURIComponent(pageId)}?text=${encodeURIComponent(shareText)}`; 
        window.location.href = messengerUrl; 
        return;
    }
    
    localStorage.setItem('sharemap_page', pageId); 
    localStorage.setItem('sharemap_orderid', generatedOrderID); 
    localStorage.setItem('sharemap_fullname', nameVal);
    localStorage.setItem('sharemap_phone', phoneVal); 
    localStorage.setItem('sharemap_landmark', landmarkVal || "Wala"); 
    localStorage.setItem('sharemap_schedule', formattedSched);
    localStorage.setItem('sharemap_orders', ordersVal); 
    localStorage.setItem('sharemap_total', totalAmountPesos.toFixed(2)); 
    localStorage.setItem('sharemap_psid', activePsid);
    localStorage.setItem('sharemap_clicked_at', clickedAtTimestamp); 
    localStorage.setItem('sharemap_payment', selectedPaymentMethod);
    sessionStorage.setItem('access_granted', 'true');
    
    const queryStr = `?pass=true&page=${encodeURIComponent(pageId)}&oid=${encodeURIComponent(generatedOrderID)}&fn=${encodeURIComponent(nameVal)}&ph=${encodeURIComponent(phoneVal)}&lm=${encodeURIComponent(landmarkVal || 'Wala')}&sched=${encodeURIComponent(formattedSched)}&ord=${encodeURIComponent(ordersVal)}&total=${totalAmountPesos.toFixed(2)}&psid=${encodeURIComponent(activePsid)}&clicked_at=${clickedAtTimestamp}&pay=${encodeURIComponent(selectedPaymentMethod)}`;
    window.location.href = `./index.html${queryStr}`;
}

window.addEventListener('DOMContentLoaded', () => {
    const pageId = getPageId(); 
    localStorage.setItem('sharemap_page', pageId); 
    document.getElementById("storeUsernameDisplay").innerText = `@${pageId.toLowerCase()}`;
    
    const urlParams = new URLSearchParams(window.location.search); 
    const passedOrders = urlParams.get('ord'); 
    const passedTotal = urlParams.get('total'); 
    const passedType = urlParams.get('type');
    const oid = urlParams.get('oid'); 
    const psid = urlParams.get('psid'); 
    const fn = urlParams.get('fn'); 
    const clicked = urlParams.get('clicked_at');
    
    if(clicked) clickedAtTimestamp = clicked; 
    if(psid) actualLoggedInPsid = psid; 
    if(fn) currentFullNameFromKiosk = fn;
    
    if(passedTotal) totalAmountPesos = parseFloat(passedTotal) || 0;
    if(passedType === 'delivery') document.getElementById('typeDelivery').checked = true; 
    else if(passedType === 'dinein') document.getElementById('typeDineIn').checked = true; 
    else if(passedType === 'counter') document.getElementById('typeCounter').checked = true;
    
    const passedCart = urlParams.get('cart');
    if(passedCart && currentOrdersList.length === 0){
        try{
            const cartObj = JSON.parse(decodeURIComponent(passedCart));
            Object.keys(cartObj).forEach(k => { currentOrdersList.push({name: k, qty: cartObj[k]}); });
        }catch(e){
            if(passedOrders && currentOrdersList.length === 0){ 
                passedOrders.split(',').forEach(itemStr => { 
                    let parts = itemStr.trim().split(' x'); 
                    if(parts.length === 2){ currentOrdersList.push({name: parts[0].trim(), qty: parseInt(parts[1]) || 1}); } 
                    else if(parts.length === 1 && parts[0]){ currentOrdersList.push({name: parts[0].trim(), qty: 1}); } 
                }); 
            }
        }
    } else if(passedOrders && currentOrdersList.length === 0){ 
        passedOrders.split(',').forEach(itemStr => { 
            let parts = itemStr.trim().split(' x'); 
            if(parts.length === 2){ currentOrdersList.push({name: parts[0].trim(), qty: parseInt(parts[1]) || 1}); } 
            else if(parts.length === 1 && parts[0]){ currentOrdersList.push({name: parts[0].trim(), qty: 1}); } 
        }); 
    }
    
    toggleServiceType(); 
    renderOrderUI(); 
    checkShareMapAccess(pageId);
    setTimeout(setupBackButtonTrayReturn, 800);
});

document.getElementById('proceedBtn').onclick = () => { openPaymentDrawer(); };
</script>
</body>
