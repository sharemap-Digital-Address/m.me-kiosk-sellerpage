<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face { font-family: "Optimistic"; font-style: normal; font-weight: 400 600; font-display: swap; src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2"); }
@font-face { font-family: "Optimistic Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2"); }
:where(html) { font-family: "Optimistic", system-ui, sans-serif; }
:where(code, pre, kbd, samp) { font-family: "Optimistic Mono", ui-monospace, monospace; }
</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareMap - Order & Service Gateway</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; margin: 0; padding: 15px 12px 30px 12px; box-sizing: border-box; }
        .card { background: #1e293b; padding: 18px 16px; border-radius: 12px; text-align: center; max-width: 420px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.3); box-sizing: border-box; }
        .store-badge { background: #0284c7; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 8px; }
        .order-id-badge { background: #0f172a; border: 1px dashed #38bdf8; padding: 8px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; color: #38bdf8; font-weight: bold; }
        .info-box { background: #0f172a; border: 1px solid #38bdf8; padding: 10px; border-radius: 8px; margin-bottom: 12px; text-align: left; font-size: 12px; }
        .service-toggle { display: flex; background: #0f172a; padding: 4px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
        .service-option { flex: 1; text-align: center; }
        .service-option input[type="radio"] { display: none; }
        .service-option label { display: block; padding: 8px 4px; font-size: 11px; font-weight: bold; color: #94a3b8; border-radius: 6px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .service-option input[type="radio"]:checked + label { background-color: #0284c7; color: #ffffff; }
        .form-group { text-align: left; margin-bottom: 10px; position: relative; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 3px; color: #cbd5e1; }
        .form-group input { width: 100%; padding: 9px; border: 1px solid #475569; border-radius: 6px; background-color: #0f172a; color: #ffffff; font-size: 14px; box-sizing: border-box; outline: none; }
        .suggestion-box { position: absolute; top: 100%; left: 0; right: 0; background: #0f172a; border: 1px solid #0284c7; border-radius: 6px; max-height: 150px; overflow-y: auto; z-index: 100; display: none; }
        .suggestion-item { padding: 10px; font-size: 13px; color: #f8fafc; border-bottom: 1px solid #1e293b; cursor: pointer; }
        .not-found-text { color: #f87171; font-size: 11px; margin-top: 4px; display: none; font-weight: bold; }
        .order-section { text-align: left; margin-top: 15px; margin-bottom: 15px; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
        .btn-add-order { background-color: #16a34a; color: #ffffff; border: none; padding: 10px; font-size: 13px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .item-row { display: flex; align-items: center; gap: 5px; margin-bottom: 8px; background: #1e293b; padding: 6px; border-radius: 6px; border: 1px solid #475569; }
        .act-btn { padding: 6px 8px; border: none; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .btn-edit { background: #eab308; color: #000; }
        .btn-del { background: #ef4444; color: white; }
        .saved-text { flex: 1; font-size: 13px; color: #f8fafc; word-break: break-word; }
        .btn { background-color: #0284c7; color: #ffffff; border: none; padding: 12px 20px; font-size: 0.95rem; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: 0.3s; margin-top: 8px; }
        .error-msg { color: #f87171; font-size: 12px; margin-top: 6px; display: none; }
        .btn-fb-login { background-color: #1877f2; color: white; border: none; padding: 10px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration:none; }
        .qr-display-box { background: #ffffff; padding: 15px; border-radius: 12px; display: inline-block; margin-top: 10px; }
        .total-amount-badge { background: #064e3b; color: #34d399; border: 1px solid #10b981; padding: 10px; border-radius: 8px; font-size: 16px; font-weight: bold; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <div id="storeUsernameDisplay" class="store-badge">@store</div>
        <h3 style="margin: 0 0 4px 0;">📍 ShareMap Ordering Gateway</h3>
        <div id="orderIdBadge" class="order-id-badge">🔢 Order ID: GENERATING...</div>

        <div class="info-box" id="orderInfoPreview">
            <div>🔢 Order #: <b id="pOrder">-</b></div>
            <div>🔒 PSID: <b id="pPsid">-</b></div>
            <div>👤 Name: <b id="pName">-</b></div>
            <div>⏰ Clicked At: <b id="pClicked">-</b></div>
        </div>

        <div style="text-align:center; margin-bottom:12px;">
            <img id="profilePic" src="https://via.placeholder.com/80?text=FB" style="width:80px; height:80px; border-radius:50%; border:3px solid #38bdf8; object-fit:cover;" />
            <div id="profileNameDisplay" style="font-size:13px; font-weight:bold; color:#38bdf8; margin-top:5px;"></div>
            <div id="psidStatus" style="font-size:10px; color:#94a3b8;">Waiting for Messenger...</div>
        </div>

        <a id="fbLoginBtn" href="#" target="_blank" class="btn-fb-login">
            Continue with 【entity-Facebook¦canonical_name=Facebook】 (Messenger)
        </a>

        <div class="service-toggle">
            <div class="service-option"><input type="radio" id="typeDelivery" name="serviceType" value="delivery" checked onchange="toggleServiceType()"><label for="typeDelivery">🛵 Delivery</label></div>
            <div class="service-option"><input type="radio" id="typeDineIn" name="serviceType" value="dinein" onchange="toggleServiceType()"><label for="typeDineIn">🍽️ Dine-In</label></div>
            <div class="service-option"><input type="radio" id="typeCounter" name="serviceType" value="counter" onchange="toggleServiceType()"><label for="typeCounter">💳 Counter</label></div>
        </div>

        <div class="form-group" style="background: #0f172a; padding: 8px; border-radius: 6px; border: 1px dashed #334155; margin-bottom: 12px;">
            <label style="font-size: 11px; color: #38bdf8;">🔒 Customer PSID:</label>
            <input type="text" id="displayPsid" readonly style="background: transparent; border: none; color: #cbd5e1; font-size: 12px; font-weight: bold; padding: 2px 0;" value="">
        </div>

        <div class="form-group">
            <label>👤 Facebook Full Name:</label>
            <input type="text" id="fullName" placeholder="Auto-fill from webhook..." autocomplete="off" oninput="handleFullNameInput(this.value)">
            <div id="notFoundIndicator" class="not-found-text"></div>
            <div id="suggestionBox" class="suggestion-box"></div>
        </div>

        <div class="form-group"><label>📞 Contact Number:</label><input type="tel" id="phone" placeholder="09123456789"></div>
        <div class="form-group" id="landmarkGroup"><label>🏠 Landmark:</label><input type="text" id="landmark" placeholder="Tabi ng Store"></div>
        <div class="form-group" id="tableGroup" style="display: none;"><label>🪑 Table Number:</label><input type="text" id="tableNum" placeholder="Table 5"></div>
        <div class="form-group" id="paxGroup" style="display: none;"><label>👥 Pax:</label><input type="number" id="paxCount" placeholder="4" min="1" value="2"></div>
        <div class="form-group" id="scheduleGroup"><label>⏰ Schedule:</label><input type="datetime-local" id="scheduleOrder"></div>

        <div class="order-section">
            <div id="totalPriceDisplay" class="total-amount-badge">💰 Total: ₱<span id="grandTotalText">0.00</span></div>
            <button type="button" class="btn-add-order" onclick="openKioskMenu()">🍔 ➕ Magdagdag / Palitan (Kiosk)</button>
            <div id="orderListContainer"></div>
        </div>

        <p id="errorMsg" class="error-msg">⚠️ Paki-fillup ang Pangalan at Contact</p>
        <button id="proceedBtn" class="btn">📍 Sunod: Kunin ang GPS Location ➔</button>

        <div id="counterQrContainer" style="display: none; margin-top: 15px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #38bdf8;">
            <h4 style="margin: 0 0 6px 0; color: #38bdf8;">📲 Advance Order QR</h4>
            <div class="qr-display-box" id="qrcodeCanvas"></div>
            <p style="font-size: 13px; font-weight: bold; color: #38bdf8; margin-top: 10px;" id="qrTextDetail"></p>
            <button type="button" class="btn" style="background-color: #16a34a; margin-top: 12px;" onclick="handleCounterCheckoutSequence()">📥 Download QR & Send to POS ➔</button>
        </div>
    </div>

<script>
const SUPABASE_URL = "https://qeqbnhpvarsdcrdzpycr.supabase.co";
let activePageAccessToken = ""; 
let cachedConversations = []; 
let isPsidVerifiedFromSuggestion = false; 
let actualLoggedInPsid = ""; 
let totalAmountPesos = 0;
let currentOrdersList = [];
let generatedOrderID = "";
let clickedAtTimestamp = 0;
let currentFullNameFromKiosk = "";
let pollingInterval = null;
let isFromKiosk = false;

function getPageId() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('page') || localStorage.getItem('sharemap_page') || "sharemapdammystore";
}
function generateSpreadsheetOrderID() {
    const now = new Date();
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const minute = now.getMinutes();
    let letterCode = minute < 26 ? alphabet[minute] : (minute < 52 ? "A" + alphabet[minute - 26] : "B" + alphabet[minute - 52]);
    return `${letterCode}${String(now.getSeconds()).padStart(2, '0')[0]}${String(now.getMilliseconds()).padStart(3, '0')[0]}`;
}

async function checkShareMapAccess(pageId) {
  try {
    const res = await fetch(`https://qeqbnhpvarsdcrdzpycr.supabase.co/functions/v1/get-store-config`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ page: pageId })
    });
    const data = await res.json();
    if (data.error || !data) return;
    if (data.page_access_token) {
      activePageAccessToken = data.page_access_token;
      fetchMetaConversationsForDoubleCheck();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const oidFromUrl = urlParams.get('oid');
    // KUNG GALING SA KIOSK - GAMITIN YUNG OID NA YUN! HUWAG NA MAG GENERATE!
    if(oidFromUrl){
      isFromKiosk = true;
      generatedOrderID = oidFromUrl;
      clickedAtTimestamp = urlParams.get('clicked_at') || localStorage.getItem('sharemap_clicked_at') || Date.now();
      currentFullNameFromKiosk = urlParams.get('fn') || "";
      actualLoggedInPsid = urlParams.get('psid') || "";
      document.getElementById("orderIdBadge").innerText = `🔢 Order ID: #${generatedOrderID} (from Kiosk)`;
      document.getElementById('fbLoginBtn').style.display = 'none'; // HINDI NA KAILANGAN m.me KASI MAY PSID NA!
      console.log("✅ Using OrderID from Kiosk:", generatedOrderID);
    } else {
      // DIRECT OPEN SA MULTIGATEWAY - DITO LANG MAG GENERATE NG BAGO + TAWAG WEBHOOK
      generatedOrderID = generateSpreadsheetOrderID();
      document.getElementById("orderIdBadge").innerText = `🔢 Order ID: #${generatedOrderID}`;
      await createInitialOrder(pageId);
      const messengerLink = `https://m.me/${encodeURIComponent(pageId)}?ref=order_${generatedOrderID}`;
      const btn = document.getElementById('fbLoginBtn');
      btn.href = messengerLink;
      btn.innerHTML = `💬 Continue with Messenger - Order #${generatedOrderID}`;
      startPollingForPsid();
    }

    updatePreview();

  } catch (err) { console.error(err); }
}

function updatePreview(){
  const urlParams = new URLSearchParams(window.location.search);
  document.getElementById('pOrder').innerText = generatedOrderID || urlParams.get('oid') || "-";
  document.getElementById('pPsid').innerText = actualLoggedInPsid || urlParams.get('psid') || document.getElementById('displayPsid').value || "-";
  document.getElementById('pName').innerText = currentFullNameFromKiosk || urlParams.get('fn') || document.getElementById('fullName').value || "-";
  document.getElementById('pClicked').innerText = clickedAtTimestamp ? new Date(parseInt(clickedAtTimestamp)).toLocaleString() : "-";

  if(actualLoggedInPsid || urlParams.get('psid')){
    document.getElementById('displayPsid').value = actualLoggedInPsid || urlParams.get('psid');
    document.getElementById('profileNameDisplay').innerText = currentFullNameFromKiosk || urlParams.get('fn') || "";
    document.getElementById('psidStatus').innerText = `✅ From Kiosk/Webhook`;
    document.getElementById('fullName').value = currentFullNameFromKiosk || urlParams.get('fn') || document.getElementById('fullName').value;
    actualLoggedInPsid = actualLoggedInPsid || urlParams.get('psid');
    isPsidVerifiedFromSuggestion = true;
  }
}

async function createInitialOrder(pageId) {
  try {
    await fetch(`${SUPABASE_URL}/functions/v1/create-order`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        order_id: generatedOrderID,
        store_page: pageId.toLowerCase(),
        orders_list: getFormattedOrdersText() || "Pending order",
        messenger_psid: null,
        customer_name: null,
        customer_profile_pic: null,
        status: 'WAITING_PSID'
      })
    });
  } catch(e) { console.error(e); }
}

function startPollingForPsid() {
  if(isFromKiosk) return; // HUWAG NA MAG POLL KUNG MAY PSID NA GALING KIOSK!
  if (pollingInterval) clearInterval(pollingInterval);
  pollingInterval = setInterval(async () => {
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/get-order-psid`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ order_id: generatedOrderID })
      });
      const orderData = await res.json();
      if (orderData && orderData.messenger_psid) {
        clearInterval(pollingInterval);
        document.getElementById('displayPsid').value = orderData.messenger_psid;
        document.getElementById('fullName').value = orderData.customer_name || "";
        document.getElementById('profileNameDisplay').innerText = orderData.customer_name || "";
        document.getElementById('psidStatus').innerText = `✅ Verified via Webhook`;
        if (orderData.customer_profile_pic) document.getElementById('profilePic').src = orderData.customer_profile_pic;
        actualLoggedInPsid = orderData.messenger_psid;
        isPsidVerifiedFromSuggestion = true;
        localStorage.setItem('sharemap_psid', orderData.messenger_psid);
        updatePreview();
      }
    } catch(e) {}
  }, 2000);
}

async function fetchMetaConversationsForDoubleCheck() {
  if (!activePageAccessToken) return;
  try {
    const response = await fetch(`https://graph.facebook.com/v26.0/me/conversations?fields=participants&access_token=${activePageAccessToken}`);
    const result = await response.json();
    if (result.data) {
      cachedConversations = [];
      result.data.forEach(conv => {
        if (conv.participants && conv.participants.data) {
          conv.participants.data.forEach(p => cachedConversations.push({ name: p.name, psid: p.id }));
        }
      });
    }
  } catch (err) {}
}

function handleFullNameInput(query) {
  const container = document.getElementById("suggestionBox");
  const notFoundInd = document.getElementById("notFoundIndicator");
  const cleanQuery = query.trim().toLowerCase();
  if (actualLoggedInPsid && document.getElementById('displayPsid').value === actualLoggedInPsid) { container.style.display = "none"; return; }
  isPsidVerifiedFromSuggestion = false; 
  if (!cleanQuery) { container.style.display = "none"; notFoundInd.style.display = "none"; return; }
  const matches = cachedConversations.filter(item => item.name && item.name.toLowerCase().includes(cleanQuery));
  if (matches.length > 0) {
    notFoundInd.style.display = "none"; container.innerHTML = "";
    matches.forEach(match => {
      const div = document.createElement("div"); div.className = "suggestion-item";
      div.innerHTML = `💬 <b>${match.name}</b>`; div.onclick = function() { selectMatchSuggestion(match.name, match.psid); }; container.appendChild(div);
    });
    container.style.display = "block";
  } else { container.style.display = "none"; }
}
function selectMatchSuggestion(name, chosenPsid) {
  document.getElementById('fullName').value = name;
  document.getElementById('displayPsid').value = chosenPsid;
  localStorage.setItem('sharemap_psid', chosenPsid);
  isPsidVerifiedFromSuggestion = true; 
  document.getElementById("suggestionBox").style.display = "none";
  updatePreview();
}

function toggleServiceType() {
    const isDelivery = document.getElementById("typeDelivery").checked;
    const isDineIn = document.getElementById("typeDineIn").checked;
    const isCounter = document.getElementById("typeCounter").checked;
    document.getElementById("landmarkGroup").style.display = isDelivery ? "block" : "none";
    document.getElementById("tableGroup").style.display = isDineIn ? "block" : "none";
    document.getElementById("paxGroup").style.display = isDineIn ? "block" : "none";
    document.getElementById("scheduleGroup").style.display = isCounter ? "none" : "block";
    document.getElementById("proceedBtn").style.display = isCounter ? "none" : "block";
    document.getElementById("counterQrContainer").style.display = isCounter ? "block" : "none";
    if(isCounter) generateCounterQr();
}
function openKioskMenu() { 
  const pageId=getPageId(); 
  const psid = document.getElementById('displayPsid').value || actualLoggedInPsid;
  const fn = document.getElementById('fullName').value;
  window.location.href=`./kioskmode.html?page=${encodeURIComponent(pageId)}&psid=${encodeURIComponent(psid)}&fn=${encodeURIComponent(fn)}&oid=${encodeURIComponent(generatedOrderID)}`; 
}
function renderOrderUI() {
    const container=document.getElementById("orderListContainer"); container.innerHTML="";
    if (currentOrdersList.length===0) { container.innerHTML=`<p style="font-size:12px; color:#94a3b8; text-align:center;">Walang order.</p>`; document.getElementById('grandTotalText').innerText="0.00"; return; }
    currentOrdersList.forEach((item,index)=>{ let row=document.createElement("div"); row.className="item-row"; row.innerHTML=`<span class="saved-text"><b>${item.name}</b> x${item.qty}</span><button type="button" class="act-btn btn-edit" onclick="editOrderQty(${index})">✏️ Edit</button><button type="button" class="act-btn btn-del" onclick="deleteOrderItem(${index})">🗑️</button>`; container.appendChild(row); });
    document.getElementById('grandTotalText').innerText=totalAmountPesos.toFixed(2);
    if (document.getElementById("typeCounter").checked) generateCounterQr();
}
function editOrderQty(index){ let current=currentOrdersList[index]; let newQty=prompt(`Bagong quantity:`,current.qty); if(newQty!==null){ let parsed=parseInt(newQty); if(!isNaN(parsed)&&parsed>0){ currentOrdersList[index].qty=parsed; renderOrderUI(); } else if(parsed===0){ currentOrdersList.splice(index,1); renderOrderUI(); } } }
function deleteOrderItem(index){ currentOrdersList.splice(index,1); renderOrderUI(); }
function getFormattedOrdersText(){ if(currentOrdersList.length===0) return "Pending order"; return currentOrdersList.map(i=>`${i.name} x${i.qty}`).join(', '); }
function generateCounterQr(){ const qrCanvasContainer=document.getElementById("qrcodeCanvas"); qrCanvasContainer.innerHTML=""; const activePsid=document.getElementById('displayPsid').value; const ordersVal=getFormattedOrdersText(); const nameVal=document.getElementById('fullName').value.trim()||"Customer"; const qrPayload=JSON.stringify({oid:generatedOrderID,psid:activePsid,name:nameVal,orders:ordersVal,total:totalAmountPesos,clicked_at:clickedAtTimestamp}); new QRCode(qrCanvasContainer,{text:qrPayload,width:200,height:200,correctLevel:QRCode.CorrectLevel.H}); document.getElementById("qrTextDetail").innerText=`Order ID: #${generatedOrderID} | Total: ₱${totalAmountPesos.toFixed(2)}`; }

window.addEventListener('DOMContentLoaded', () => {
    const pageId = getPageId();
    localStorage.setItem('sharemap_page', pageId);
    document.getElementById("storeUsernameDisplay").innerText = `@${pageId.toLowerCase()}`;
    const urlParams = new URLSearchParams(window.location.search);
    
    const passedOrders = urlParams.get('ord'); 
    const passedTotal = urlParams.get('total'); 
    const passedType = urlParams.get('type');
    const oid = urlParams.get('oid');
    const psid = urlParams.get('psid');
    const fn = urlParams.get('fn');
    const clicked = urlParams.get('clicked_at');

    if(oid) generatedOrderID = oid;
    if(clicked) clickedAtTimestamp = clicked;
    if(psid) actualLoggedInPsid = psid;
    if(fn) currentFullNameFromKiosk = fn;

    if (passedTotal) totalAmountPesos = parseFloat(passedTotal) || 0;
    if (passedType === 'delivery') document.getElementById('typeDelivery').checked=true; else if (passedType==='dinein') document.getElementById('typeDineIn').checked=true; else if (passedType==='counter') document.getElementById('typeCounter').checked=true;
    if (passedOrders && currentOrdersList.length===0) { passedOrders.split(',').forEach(itemStr=>{ let parts=itemStr.trim().split(' x'); if(parts.length===2){ currentOrdersList.push({name:parts[0].trim(),qty:parseInt(parts[1])||1}); } else if(parts.length===1&&parts[0]){ currentOrdersList.push({name:parts[0].trim(),qty:1}); } }); }
    toggleServiceType(); renderOrderUI(); checkShareMapAccess(pageId);
    
    if(psid || fn || oid){ setTimeout(updatePreview, 500); }
});
</script>
</body>
</html>
