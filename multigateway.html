<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareMap - Order & Service Gateway</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://qeqbnhpvarsdcrdzpycr.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_KwWNvUe_KuZatiWB8nVvkQ_56JRPiif";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let activePageAccessToken = ""; // Global variable para sa Page Token

        async function checkShareMapAccess() {
            const urlParams = new URLSearchParams(window.location.search);
            const pageId = urlParams.get('page') || localStorage.getItem('sharemap_page');

            if (!pageId) {
                alert("⚠️ Walang natagpung Store Page ID. Hindi maiproseso ang gateway.");
                document.body.innerHTML = "<h2 style='color:red; text-align:center; margin-top:50px;'>⚠️ Invalid Gateway Link</h2>";
                return;
            }

            const { data, error } = await supabaseClient
                .from('licenses')
                .select('*')
                .eq('username', pageId.toLowerCase())
                .single();

            const today = new Date().toISOString().split('T')[0];

            if (error || !data || data.status === "INACTIVE") {
                showBlockScreen("⚠️ Walang Lisensya / Inactive Account", "Ang store na ito ay wala pang lisensya sa ShareMap. Mangyaring makipag-ugnayan sa provider.");
                return;
            }

            if (data.expiry && today > data.expiry) {
                showBlockScreen("🚫 Expired License", `Ang inyong ${data.plan === 'BRONZE_MONTHLY' ? 'Bronze Monthly' : 'Trial'} Access ay nag-expire noong ${data.expiry}. Paki-renew ang inyong subscription sa ShareMap.`);
                return;
            }

            // Kuhanin ang Page Access Token mula sa Supabase
            if (data.page_access_token) {
                activePageAccessToken = data.page_access_token;
                console.log(`✅ Page Token nakuha mula sa Supabase para sa store: ${pageId}`);
                
                // Simulan ang pag-detect kay client gamit ang Messenger SDK
                initializeClientAutoLogin();
            } else {
                console.warn("⚠️ Walang Page Access Token na nakaimbak para sa store na ito sa Supabase.");
            }

            console.log(`✅ Access Granted for ${pageId} [Plan: ${data.plan}]`);
        }

        // --- BACKGROUND AUTO-LOGIN & NAME FETCHING MULA KAY META ---
        async function initializeClientAutoLogin() {
            let currentPsid = "";
            const urlParams = new URLSearchParams(window.location.search);
            let rawPsid = urlParams.get('psid');

            if (!rawPsid || rawPsid.includes("PSID") || rawPsid.includes("DITO") || rawPsid === "USER_ACTUAL_PSID_DITO") {
                // Gamitin ang iyong totoong Facebook App ID para sa Messenger Extensions SDK
                if (typeof MessengerExtensions !== 'undefined') {
                    MessengerExtensions.getContext('2070260990400834', 
                        async function success(result) {
                            if (result && result.ps_thread_id) {
                                currentPsid = result.ps_thread_id;
                                processCustomerDetails(currentPsid);
                            }
                        },
                        function error(err) {
                            console.log("Messenger SDK context error:", err);
                            fallbackDefaultPsid();
                        }
                    );
                } else {
                    fallbackDefaultPsid();
                }
            } else {
                currentPsid = rawPsid.trim();
                processCustomerDetails(currentPsid);
            }
        }

        function fallbackDefaultPsid() {
            let currentPsid = localStorage.getItem('sharemap_psid');
            if (!currentPsid || currentPsid.includes("PSID") || currentPsid.includes("DITO")) {
                currentPsid = "MESSENGER_WEB_USER";
            }
            document.getElementById('displayPsid').value = currentPsid;
        }

        async function processCustomerDetails(psid) {
            document.getElementById('displayPsid').value = psid;
            localStorage.setItem('sharemap_psid', psid);

            // Kung mayroon tayong Page Access Token at Valid PSID, kunin ang pangalan ni client!
            if (activePageAccessToken && psid && psid !== "MESSENGER_WEB_USER") {
                try {
                    const response = await fetch(`https://graph.facebook.com/v26.0/${psid}?fields=name&access_token=${activePageAccessToken}`);
                    const fbUser = await response.json();

                    if (fbUser && fbUser.name) {
                        // AUTO-FILL SA FULL NAME INPUT FIELD!
                        document.getElementById('fullName').value = fbUser.name;
                        console.log("✨ Na-auto-login ang pangalan:", fbUser.name);
                    }
                } catch (e) {
                    console.error("Error sa pagkuha ng pangalan mula sa Meta Graph API:", e);
                }
            }
        }

        function showBlockScreen(title, message) {
            const CONTACT_LINK = "https://m.me/sharemap.digital.address"; 

            document.body.innerHTML = `
                <div style="background:#0f172a; color:#fff; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; font-family:sans-serif;">
                    <div style="background:#1e293b; padding:30px; border-radius:12px; border:1px solid #ef4444; max-width:400px; width:90%; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
                        <h2 style="color:#ef4444; margin-top:0; font-size:20px;">${title}</h2>
                        <p style="color:#cbd5e1; font-size:14px; line-height:1.5;">${message}</p>
                        
                        <a href="${CONTACT_LINK}" target="_blank" style="display:inline-block; margin-top:15px; background:#2563eb; color:#fff; text-decoration:none; padding:12px 24px; border-radius:8px; font-weight:bold; font-size:14px; width:80%;">
                            💬 Contact Developer / Renew Access
                        </a>

                        <hr style="border:0; border-top:1px solid #334155; margin:25px 0 15px 0;">
                        <p style="font-size:11px; color:#94a3b8; margin:0;">ShareMap Licensing Protection &copy; 2026</p>
                    </div>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkShareMapAccess();
        });
    </script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 15px 12px 30px 12px;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            padding: 18px 16px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        .order-id-badge {
            background: #0f172a;
            border: 1px dashed #38bdf8;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #38bdf8;
            font-weight: bold;
        }
        .service-toggle {
            display: flex;
            background: #0f172a;
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }
        .service-option { flex: 1; text-align: center; }
        .service-option input[type="radio"] { display: none; }
        .service-option label {
            display: block;
            padding: 10px 6px;
            font-size: 13px;
            font-weight: bold;
            color: #94a3b8;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .service-option input[type="radio"]:checked + label {
            background-color: #0284c7;
            color: #ffffff;
        }
        .form-group { text-align: left; margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 3px; color: #cbd5e1; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 9px;
            border: 1px solid #475569;
            border-radius: 6px;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .form-group input:focus { border-color: #38bdf8; }
        .order-section {
            text-align: left;
            margin-top: 15px;
            margin-bottom: 15px;
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .order-section h4 { margin: 0 0 10px 0; font-size: 13px; color: #38bdf8; }
        .btn-add-order {
            background-color: #16a34a;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn-add-order:hover { background-color: #15803d; }
        .item-row {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 8px;
            background: #1e293b;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #475569;
        }
        .act-btn { padding: 6px 8px; border: none; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .btn-edit { background: #eab308; color: #000; }
        .btn-del { background: #ef4444; color: white; }
        .saved-text { flex: 1; font-size: 13px; color: #f8fafc; word-break: break-word; }
        .btn {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            margin-top: 8px;
        }
        .btn:hover { background-color: #0369a1; }
        .btn-sms { background-color: #16a34a; margin-top: 10px; }
        .btn-sms:hover { background-color: #15803d; }
        .error-msg { color: #f87171; font-size: 12px; margin-top: 6px; display: none; }
    </style>
    <!-- Messenger Extensions SDK Library -->
    <script crossorigin="anonymous" src="https://connect.facebook.net/en_US/messenger.Extensions.js"></script>
</head>
<body>

    <div class="card">
        <h3 style="margin: 0 0 4px 0;">📍 ShareMap Orders Gateway</h3>
        <div id="orderIdBadge" class="order-id-badge">🔢 Order ID: GENERATING...</div>
        <p style="font-size: 12px; color: #94a3b8; margin: 0 0 12px 0;">Pumili ng serbisyo at sagutan ang mga detalye:</p>

        <div class="service-toggle">
            <div class="service-option">
                <input type="radio" id="typeDelivery" name="serviceType" value="delivery" checked onchange="toggleServiceType()">
                <label for="typeDelivery">🛵 Book Delivery</label>
            </div>
            <div class="service-option">
                <input type="radio" id="typeDineIn" name="serviceType" value="dinein" onchange="toggleServiceType()">
                <label for="typeDineIn">🍽️ Book Dine-In</label>
            </div>
        </div>

        <!-- Non-clickable PSID Display Field -->
        <div class="form-group" style="background: #0f172a; padding: 8px; border-radius: 6px; border: 1px dashed #334155; margin-bottom: 12px;">
            <label style="font-size: 11px; color: #38bdf8; margin-bottom: 2px;">🔒 Customer PSID (Messenger ID):</label>
            <input type="text" id="displayPsid" readonly style="background: transparent; border: none; color: #cbd5e1; font-size: 12px; font-weight: bold; padding: 2px 0; cursor: not-allowed;" value="Loading PSID...">
        </div>

        <div class="form-group">
            <label for="fullName">👤 Buong Pangalan (Full Name):</label>
            <input type="text" id="fullName" placeholder="hal. Juan Dela Cruz" autocomplete="off">
        </div>

        <div class="form-group">
            <label for="phone">📞 Contact Number:</label>
            <input type="tel" id="phone" placeholder="hal. 09123456789" autocomplete="off">
        </div>

        <div class="form-group" id="landmarkGroup">
            <label for="landmark">🏠 Landmark / Kulay ng Gate (Opsyonal):</label>
            <input type="text" id="landmark" placeholder="hal. Tabi ng Sari-sari Store" autocomplete="off">
        </div>

        <div class="form-group" id="paxGroup" style="display: none;">
            <label for="paxCount">👥 Bilang ng Tao (Pax / Table Size):</label>
            <input type="number" id="paxCount" placeholder="hal. 4" min="1" value="2">
        </div>

        <div class="form-group">
            <label for="scheduleOrder" id="scheduleLabel">⏰ Schedule Order / Oras ng Delivery (Opsyonal):</label>
            <input type="datetime-local" id="scheduleOrder">
            <small id="scheduleNote" style="font-size: 11px; color: #38bdf8;">*Iwanang blanko kung para sa AGAD-AGAD na order (Now).</small>
        </div>

        <div class="order-section">
            <h4>🛒 Order List (Mga Bibilhin):</h4>
            <button type="button" class="btn-add-order" onclick="openKioskMenu()">
                🍔 ➕ Magdagdag ng Order (Kiosk Mode)
            </button>
            <div id="orderListContainer"></div>
        </div>

        <p id="errorMsg" class="error-msg">⚠️ Paki-fillup ang Pangalan at Contact Number bago magpatuloy.</p>

        <button id="proceedBtn" class="btn">📍 Sunod: Kunin ang GPS Location ➔</button>

        <div id="dineInSmsContainer" style="display: none; margin-top: 15px; padding-top: 12px; border-top: 1px dashed #475569;">
            <div class="form-group" style="margin-bottom: 8px;">
                <label for="smsStoreNum" style="font-size: 11px; color: #38bdf8;">📱 Opsyonal: Cellphone Number ng Store/Manager para sa SMS:</label>
                <input type="tel" id="smsStoreNum" placeholder="hal. 09123456789" autocomplete="off">
            </div>
            <button type="button" id="smsBtn" class="btn btn-sms" onclick="handleSmsReservation()">📱 I-send ang Reservation via SMS</button>
        </div>
    </div>

    <script>
        let currentOrdersList = [];
        let generatedOrderID = "";

        function generateSpreadsheetOrderID() {
            const now = new Date();
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const minute = now.getMinutes();
            
            let letterCode = "";
            if (minute < 26) {
                letterCode = alphabet[minute];
            } else if (minute < 52) {
                letterCode = "A" + alphabet[minute - 26];
            } else {
                letterCode = "B" + alphabet[minute - 52];
            }

            const secondDigit = String(now.getSeconds()).padStart(2, '0')[0];
            const milliDigit = String(now.getMilliseconds()).padStart(3, '0')[0];

            return `${letterCode}${secondDigit}${milliDigit}`;
        }

        function getPageId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('page') || localStorage.getItem('sharemap_page') || "TechSavyBoy.SketchDevPro";
        }

        window.addEventListener('DOMContentLoaded', () => {
            const pageId = getPageId();
            localStorage.setItem('sharemap_page', pageId);

            document.getElementById('phone').value = "";
            document.getElementById('landmark').value = "";
            document.getElementById('scheduleOrder').value = "";
            document.getElementById('smsStoreNum').value = "";
            
            generatedOrderID = generateSpreadsheetOrderID();
            document.getElementById("orderIdBadge").innerText = `🔢 Order ID: #${generatedOrderID}`;

            const urlParams = new URLSearchParams(window.location.search);
            const passedOrders = urlParams.get('ord');

            if (passedOrders) {
                passedOrders.split(',').forEach(itemStr => {
                    let parts = itemStr.trim().split(' x');
                    if (parts.length === 2) {
                        currentOrdersList.push({ name: parts[0].trim(), qty: parseInt(parts[1]) || 1 });
                    } else if (parts.length === 1 && parts[0]) {
                        currentOrdersList.push({ name: parts[0].trim(), qty: 1 });
                    }
                });
            } else {
                currentOrdersList = [];
                localStorage.removeItem('sharemap_orders_array');
                localStorage.removeItem('sharemap_orders');
            }
            renderOrderUI();
        });

        function toggleServiceType() {
            const isDineIn = document.getElementById("typeDineIn").checked;
            const landmarkGroup = document.getElementById("landmarkGroup");
            const paxGroup = document.getElementById("paxGroup");
            const scheduleLabel = document.getElementById("scheduleLabel");
            const scheduleNote = document.getElementById("scheduleNote");
            const proceedBtn = document.getElementById("proceedBtn");
            const dineInSmsContainer = document.getElementById("dineInSmsContainer");

            if (isDineIn) {
                landmarkGroup.style.display = "none";
                paxGroup.style.display = "block";
                scheduleLabel.innerText = "⏰ Petsa at Oras ng Pagkain (Dine-In Schedule):";
                scheduleNote.innerText = "*Iwanang blanko kung pupunta na AGAD-AGAD sa store.";
                proceedBtn.innerText = "📩 I-send ang Reservation sa Messenger ➔";
                dineInSmsContainer.style.display = "block";
            } else {
                landmarkGroup.style.display = "block";
                paxGroup.style.display = "none";
                scheduleLabel.innerText = "⏰ Schedule Order / Oras ng Delivery (Opsyonal):";
                scheduleNote.innerText = "*Iwanang blanko kung para sa AGAD-AGAD na order (Now).";
                proceedBtn.innerText = "📍 Sunod: Kunin ang GPS Location ➔";
                dineInSmsContainer.style.display = "none";
            }
        }

        function openKioskMenu() {
            const pageId = getPageId();
            window.location.href = `./kioskmode.html?page=${encodeURIComponent(pageId)}&psid=${encodeURIComponent(document.getElementById('displayPsid').value)}`;
        }

        function renderOrderUI() {
            const container = document.getElementById("orderListContainer");
            container.innerHTML = "";

            if (currentOrdersList.length === 0) {
                container.innerHTML = `<p style="font-size:12px; color:#94a3b8; text-align:center; margin:8px 0;">Walang pang order. Pindutin ang button sa taas para mamili.</p>`;
                return;
            }

            currentOrdersList.forEach((item, index) => {
                let row = document.createElement("div");
                row.className = "item-row";
                row.innerHTML = `
                    <span class="saved-text"><b>${item.name}</b> x${item.qty}</span>
                    <button type="button" class="act-btn btn-edit" onclick="editOrderQty(${index})">✏️ Edit Qty</button>
                    <button type="button" class="act-btn btn-del" onclick="deleteOrderItem(${index})">🗑️</button>
                `;
                container.appendChild(row);
            });

            let summaryText = currentOrdersList.map(i => `${i.name} x${i.qty}`).join(', ');
            localStorage.setItem('sharemap_orders', summaryText);
        }

        function editOrderQty(index) {
            let current = currentOrdersList[index];
            let newQty = prompt(`Ilagay ang bagong quantity para sa "${current.name}":`, current.qty);
            if (newQty !== null) {
                let parsed = parseInt(newQty);
                if (!isNaN(parsed) && parsed > 0) {
                    currentOrdersList[index].qty = parsed;
                    renderOrderUI();
                } else if (parsed === 0) {
                    currentOrdersList.splice(index, 1);
                    renderOrderUI();
                }
            }
        }

        function deleteOrderItem(index) {
            currentOrdersList.splice(index, 1);
            renderOrderUI();
        }

        function getFormattedOrdersText() {
            if (currentOrdersList.length === 0) return "Walang order";
            return currentOrdersList.map(i => `${i.name} x${i.qty}`).join(', ');
        }

        function formatScheduleText(rawInput) {
            if (!rawInput) return "Now (Agad-agad)";
            const dt = new Date(rawInput);
            if (isNaN(dt.getTime())) return rawInput;
            return dt.toLocaleString('en-PH', { dateStyle: 'medium', timeStyle: 'short' });
        }

        function handleProcessOrder() {
            const nameVal = document.getElementById('fullName').value.trim();
            const phoneVal = document.getElementById('phone').value.trim();
            const landmarkVal = document.getElementById('landmark').value.trim();
            const paxVal = document.getElementById('paxCount').value.trim();
            const schedVal = document.getElementById('scheduleOrder').value;
            const ordersVal = getFormattedOrdersText();
            const isDineIn = document.getElementById("typeDineIn").checked;
            const pageId = getPageId();
            const activePsid = document.getElementById('displayPsid').value;

            if (!nameVal || !phoneVal) {
                document.getElementById('errorMsg').style.display = "block";
                return;
            }
            document.getElementById('errorMsg').style.display = "none";

            const formattedSched = formatScheduleText(schedVal);

            if (isDineIn) {
                const formattedOrders = ordersVal.split(', ').join('\n• ');
                const shareText = `🍽️ DINE-IN TABLE RESERVATION\npsid: ${activePsid}\n🔢 Order ID: #${generatedOrderID}\n🏪 Store / Page: ${pageId}\n⏰ Schedule: ${formattedSched}\n👥 Party Size: ${paxVal || '2'} Pax\n\n🛒 Advance Orders:\n• ${formattedOrders}\n\n👤 Name: ${nameVal}\n📞 Contact: ${phoneVal}`;
                const messengerUrl = `https://m.me/${encodeURIComponent(pageId)}?text=${encodeURIComponent(shareText)}`;
                
                window.location.href = messengerUrl;
                return;
            }

            localStorage.setItem('sharemap_page', pageId);
            localStorage.setItem('sharemap_orderid', generatedOrderID);
            localStorage.setItem('sharemap_fullname', nameVal);
            localStorage.setItem('sharemap_phone', phoneVal);
            localStorage.setItem('sharemap_landmark', landmarkVal || "Wala");
            localStorage.setItem('sharemap_schedule', formattedSched);
            localStorage.setItem('sharemap_orders', ordersVal);
            localStorage.setItem('sharemap_psid', activePsid);
            sessionStorage.setItem('access_granted', 'true');

            const queryStr = `?pass=true&page=${encodeURIComponent(pageId)}&oid=${encodeURIComponent(generatedOrderID)}&fn=${encodeURIComponent(nameVal)}&ph=${encodeURIComponent(phoneVal)}&lm=${encodeURIComponent(landmarkVal || 'Wala')}&sched=${encodeURIComponent(formattedSched)}&ord=${encodeURIComponent(ordersVal)}&psid=${encodeURIComponent(activePsid)}`;
            window.location.href = `./index.html${queryStr}`;
        }

        function handleSmsReservation() {
            const nameVal = document.getElementById('fullName').value.trim();
            const phoneVal = document.getElementById('phone').value.trim();
            const paxVal = document.getElementById('paxCount').value.trim();
            const schedVal = document.getElementById('scheduleOrder').value;
            const ordersVal = getFormattedOrdersText();
            const targetPhone = document.getElementById('smsStoreNum').value.trim();
            const pageId = getPageId();
            const activePsid = document.getElementById('displayPsid').value;

            if (!nameVal || !phoneVal) {
                document.getElementById('errorMsg').style.display = "block";
                return;
            }
            if (!targetPhone) {
                alert("Paki-lagay ang cellphone number ng Branch Store/Manager para sa SMS!");
                return;
            }
            document.getElementById('errorMsg').style.display = "none";

            const formattedSched = formatScheduleText(schedVal);
            const formattedOrders = ordersVal.split(', ').join('\n• ');

            const smsBodyText = `SHAREMAP DINE-IN RESERVATION\n` +
                                `psid: ${activePsid}\n` +
                                `🔢 Order ID: #${generatedOrderID}\n` +
                                `🏪 Store: ${pageId}\n` +
                                `⏰ Schedule: ${formattedSched}\n` +
                                `👥 Party Size: ${paxVal || '2'} Pax\n\n` +
                                `🛒 Advance Orders:\n• ${formattedOrders}\n\n` +
                                `👤 Name: ${nameVal}\n` +
                                `📞 Contact: ${phoneVal}`;

            const encodedText = encodeURIComponent(smsBodyText);
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            const delimiter = isIOS ? '&' : '?';
            const smsUri = `sms:${targetPhone}${delimiter}body=${encodedText}`;

            window.location.href = smsUri;
        }

        document.getElementById('proceedBtn').onclick = () => {
            handleProcessOrder();
        };
    </script>
</body>
</html>
