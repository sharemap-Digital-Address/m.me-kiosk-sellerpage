<script>
const SUPABASE_URL = "https://qeqbnhpvarsdcrdzpycr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_KwWNvUe_KuZatiWB8nVvkQ_56JRPiif";
let activePageAccessToken = ""; let cachedConversations = []; let isPsidVerifiedFromSuggestion = false; 
let actualLoggedInPsid = ""; let totalAmountPesos = 0; let currentOrdersList = []; let generatedOrderID = "";
let clickedAtTimestamp = 0; let currentFullNameFromKiosk = ""; let pollingInterval = null; let isFromKiosk = false;

function getPageId(){ const urlParams=new URLSearchParams(window.location.search); return urlParams.get('page')||localStorage.getItem('sharemap_page')||"sharemapdammystore"; }
function generateSpreadsheetOrderID(){ const now=new Date(); const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ"; const minute=now.getMinutes(); let letterCode=minute<26?alphabet[minute]:(minute<52?"A"+alphabet[minute-26]:"B"+alphabet[minute-52]); return `${letterCode}${String(now.getSeconds()).padStart(2,'0')[0]}${String(now.getMilliseconds()).padStart(3,'0')[0]}`; }

// === SECURED + HYBRID: TANGGAPIN OID GALING KIOSK ===
async function checkShareMapAccess(pageId){
  try{
    const res=await fetch(`${SUPABASE_URL}/functions/v1/get-store-config`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page:pageId})});
    const data=await res.json(); if(data.error||!data) return;
    if(data.page_access_token){ activePageAccessToken=data.page_access_token; fetchMetaConversations(); }
    const urlParams=new URLSearchParams(window.location.search); const oidFromUrl=urlParams.get('oid');
    if(oidFromUrl){
      isFromKiosk=true; generatedOrderID=oidFromUrl; clickedAtTimestamp=urlParams.get('clicked_at')||localStorage.getItem('sharemap_clicked_at')||Date.now();
      currentFullNameFromKiosk=urlParams.get('fn')||""; actualLoggedInPsid=urlParams.get('psid')||"";
      document.getElementById("orderIdBadge").innerText=`🔢 Order ID: #${generatedOrderID} (from Kiosk)`;
    } else {
      generatedOrderID=generateSpreadsheetOrderID(); document.getElementById("orderIdBadge").innerText=`🔢 Order ID: #${generatedOrderID}`;
      // REMOVED: createInitialOrder + m.me messengerLink + startPollingForPsid - using localStorage fast lane na
    }
    updatePreview();
  }catch(err){ console.error(err); }
}
function updatePreview(){
  const urlParams=new URLSearchParams(window.location.search);
  document.getElementById('pOrder').innerText=generatedOrderID||urlParams.get('oid')||"-";
  document.getElementById('pPsid').innerText=actualLoggedInPsid||urlParams.get('psid')||document.getElementById('displayPsid').value||"-";
  document.getElementById('pName').innerText=currentFullNameFromKiosk||urlParams.get('fn')||document.getElementById('fullName').value||"-";
  document.getElementById('pClicked').innerText=clickedAtTimestamp?new Date(parseInt(clickedAtTimestamp)).toLocaleString():"-";
  if(actualLoggedInPsid||urlParams.get('psid')){
    document.getElementById('displayPsid').value=actualLoggedInPsid||urlParams.get('psid');
    document.getElementById('profileNameDisplay').innerText=currentFullNameFromKiosk||urlParams.get('fn')||"";
    document.getElementById('psidStatus').innerText=`✅ From Kiosk/Webhook`; document.getElementById('fullName').value=currentFullNameFromKiosk||urlParams.get('fn')||document.getElementById('fullName').value;
    actualLoggedInPsid=actualLoggedInPsid||urlParams.get('psid'); isPsidVerifiedFromSuggestion=true;
  }
}
async function createInitialOrder(pageId){
  // REMOVED - makakatipid sa call, hindi na gumagawa ng WAITING_PSID order sa Supabase pag fresh open
  console.log("ℹ️ createInitialOrder disabled - localStorage fast lane");
  return;
}
function startPollingForPsid(){
  // REMOVED - makakatipid sa call, localStorage fast lane na gamit
  console.log("ℹ️ startPollingForPsid disabled - using localStorage fast lane");
  return;
}
async function fetchMetaConversations(){
  if(!activePageAccessToken) return;
  try{ const response=await fetch(`https://graph.facebook.com/v26.0/me/conversations?fields=participants&access_token=${activePageAccessToken}`); const result=await response.json();
    if(result.data){ cachedConversations=[]; result.data.forEach(conv=>{ if(conv.participants&&conv.participants.data){ conv.participants.data.forEach(p=>cachedConversations.push({name:p.name,psid:p.id})); } }); }
  }catch(err){}
}
function handleFullNameInput(query){
  const container=document.getElementById("suggestionBox"); const notFoundInd=document.getElementById("notFoundIndicator"); const cleanQuery=query.trim().toLowerCase();
  if(actualLoggedInPsid&&document.getElementById('displayPsid').value===actualLoggedInPsid){ container.style.display="none"; return; }
  isPsidVerifiedFromSuggestion=false; if(!cleanQuery){ container.style.display="none"; notFoundInd.style.display="none"; return; }
  const matches=cachedConversations.filter(item=>item.name&&item.name.toLowerCase().includes(cleanQuery));
  if(matches.length>0){ notFoundInd.style.display="none"; container.innerHTML=""; matches.forEach(match=>{ const div=document.createElement("div"); div.className="suggestion-item"; div.innerHTML=`💬 <b>${match.name}</b>`; div.onclick=function(){ selectMatchSuggestion(match.name,match.psid); }; container.appendChild(div); }); container.style.display="block"; } else { container.style.display="none"; }
}
function selectMatchSuggestion(name,chosenPsid){
  document.getElementById('fullName').value=name; document.getElementById('displayPsid').value=chosenPsid;
  localStorage.setItem('sharemap_psid',chosenPsid); isPsidVerifiedFromSuggestion=true; document.getElementById("suggestionBox").style.display="none"; updatePreview();
}
function toggleServiceType(){
    const isDelivery=document.getElementById("typeDelivery").checked; const isDineIn=document.getElementById("typeDineIn").checked; const isCounter=document.getElementById("typeCounter").checked;
    document.getElementById("landmarkGroup").style.display=isDelivery?"block":"none"; document.getElementById("tableGroup").style.display=isDineIn?"block":"none";
    document.getElementById("paxGroup").style.display=isDineIn?"block":"none"; document.getElementById("scheduleGroup").style.display=isCounter?"none":"block";
    document.getElementById("proceedBtn").style.display=isCounter?"none":"block"; document.getElementById("counterQrContainer").style.display=isCounter?"block":"none";
    if(isCounter) generateCounterQr();
}
function openKioskMenu(){ 
    const pageId=getPageId(); 
    const psid=document.getElementById('displayPsid').value||actualLoggedInPsid||""; 
    const fn=document.getElementById('fullName').value||currentFullNameFromKiosk||"";
    const ordText = getFormattedOrdersText() || new URLSearchParams(window.location.search).get('ord') || "";
    const totalText = totalAmountPesos ? totalAmountPesos.toFixed(2) : (new URLSearchParams(window.location.search).get('total')||"0.00");
    const typeVal = document.getElementById('typeDelivery').checked ? 'delivery' : (document.getElementById('typeDineIn').checked ? 'dinein' : 'counter');
    // === BUONG TRAY - McDo tray analogy ===
    let cartObj = {};
    if(currentOrdersList && currentOrdersList.length>0){
        currentOrdersList.forEach(o=>{ cartObj[o.name] = o.qty; });
    }
    const savedCartJson = localStorage.getItem(`cart_${generatedOrderID}`);
    let cartJsonToSend = "";
    if(Object.keys(cartObj).length>0){
        cartJsonToSend = encodeURIComponent(JSON.stringify(cartObj));
        localStorage.setItem(`cart_${generatedOrderID}`, JSON.stringify(cartObj));
    } else if(savedCartJson){
        cartJsonToSend = encodeURIComponent(savedCartJson);
    } else {
        const urlCart = new URLSearchParams(window.location.search).get('cart');
        if(urlCart) cartJsonToSend = urlCart;
    }
    if(psid) localStorage.setItem('sharemap_psid', psid);
    if(fn) localStorage.setItem('sharemap_fullname', fn);
    localStorage.setItem('sharemap_orderid', generatedOrderID);
    localStorage.setItem('sharemap_clicked_at', clickedAtTimestamp);
    // BUONG TRAY IBABALIK KAY KIOSKMODE - hindi back to zero!
    window.location.href=`./kioskmode.html?page=${encodeURIComponent(pageId)}&psid=${encodeURIComponent(psid)}&fn=${encodeURIComponent(fn)}&oid=${encodeURIComponent(generatedOrderID)}&clicked_at=${clickedAtTimestamp}&ord=${encodeURIComponent(ordText)}&total=${encodeURIComponent(totalText)}&type=${encodeURIComponent(typeVal)}&cart=${cartJsonToSend}`;
}
function setupBackButtonTrayReturn(){
    // Para sa phone back button - ibabalik buong tray, hindi mawawala
    history.pushState({tray: true, oid: generatedOrderID}, "", location.href);
    window.addEventListener('popstate', function(e){
        console.log("🔙 Back button - ibabalik buong tray kay kioskmode");
        openKioskMenu();
    });
}
function renderOrderUI(){
    const container=document.getElementById("orderListContainer"); container.innerHTML="";
    if(currentOrdersList.length===0){ container.innerHTML=`<p style="font-size:12px; color:#94a3b8; text-align:center;">Walang order.</p>`; document.getElementById('grandTotalText').innerText="0.00"; return; }
    currentOrdersList.forEach((item,index)=>{ let row=document.createElement("div"); row.className="item-row"; row.innerHTML=`<span class="saved-text"><b>${item.name}</b> x${item.qty}</span><button type="button" class="act-btn btn-edit" onclick="editOrderQty(${index})">✏️ Edit</button><button type="button" class="act-btn btn-del" onclick="deleteOrderItem(${index})">🗑️</button>`; container.appendChild(row); });
    document.getElementById('grandTotalText').innerText=totalAmountPesos.toFixed(2); if(document.getElementById("typeCounter").checked) generateCounterQr();
}
function editOrderQty(index){ let current=currentOrdersList[index]; let newQty=prompt(`Bagong quantity:`,current.qty); if(newQty!==null){ let parsed=parseInt(newQty); if(!isNaN(parsed)&&parsed>0){ currentOrdersList[index].qty=parsed; renderOrderUI(); } else if(parsed===0){ currentOrdersList.splice(index,1); renderOrderUI(); } } }
function deleteOrderItem(index){ currentOrdersList.splice(index,1); renderOrderUI(); }
function getFormattedOrdersText(){ if(currentOrdersList.length===0) return "Pending order"; return currentOrdersList.map(i=>`${i.name} x${i.qty}`).join(', '); }
function formatScheduleText(rawInput){ if(!rawInput) return "Now (Agad-agad)"; const dt=new Date(rawInput); if(isNaN(dt.getTime())) return rawInput; return dt.toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'}); }
function generateCounterQr(){ const qrCanvasContainer=document.getElementById("qrcodeCanvas"); qrCanvasContainer.innerHTML=""; const activePsid=document.getElementById('displayPsid').value; const ordersVal=getFormattedOrdersText(); const nameVal=document.getElementById('fullName').value.trim()||"Customer"; const qrPayload=JSON.stringify({oid:generatedOrderID,psid:activePsid,name:nameVal,orders:ordersVal,total:totalAmountPesos,clicked_at:clickedAtTimestamp}); new QRCode(qrCanvasContainer,{text:qrPayload,width:200,height:200,correctLevel:QRCode.CorrectLevel.H}); document.getElementById("qrTextDetail").innerText=`Order ID: #${generatedOrderID} | Total: ₱${totalAmountPesos.toFixed(2)}`; }

// === ORIGINAL FUNCTIONS NA NAWALA - IBINALIK! ===
async function saveOrderToSupabasePOS(orderData){
    try{
        const { createClient } = supabase; const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data, error } = await client.from('orders').insert([orderData]);
        if(error) console.error("Supabase Save Error:", error); else console.log("✅ Saved to POS!");
    }catch(err){ console.error(err); }
}
function downloadQrCodeImageWithDetails(){
    const qrContainer=document.getElementById("qrcodeCanvas"); const originalCanvas=qrContainer.querySelector("canvas"); const pageId=getPageId();
    if(!originalCanvas){ alert("⚠️ Re-generating QR..."); generateCounterQr(); return; }
    const exportCanvas=document.createElement("canvas"); const ctx=exportCanvas.getContext("2d"); const padding=20; const textSpace=100;
    exportCanvas.width=originalCanvas.width+(padding*2); exportCanvas.height=originalCanvas.height+(padding*2)+textSpace;
    ctx.fillStyle="#FFFFFF"; ctx.fillRect(0,0,exportCanvas.width,exportCanvas.height); ctx.drawImage(originalCanvas,padding,padding);
    ctx.fillStyle="#000000"; ctx.font="bold 15px Arial"; ctx.textAlign="center"; let currentY=originalCanvas.height+padding+22;
    ctx.fillText(`Store: @${pageId.toLowerCase()}`,exportCanvas.width/2,currentY); currentY+=20; ctx.font="bold 16px Arial"; ctx.fillText(`Order ID: #${generatedOrderID}`,exportCanvas.width/2,currentY);
    currentY+=18; ctx.font="11px Arial"; ctx.fillStyle="#475569"; const nowStr=new Date().toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'}); ctx.fillText(`Generated: ${nowStr}`,exportCanvas.width/2,currentY);
    currentY+=22; ctx.font="bold 14px Arial"; ctx.fillStyle="#16a34a"; ctx.fillText(`Total: ₱${totalAmountPesos.toFixed(2)}`,exportCanvas.width/2,currentY);
    const imageUri=exportCanvas.toDataURL("image/png"); const link=document.createElement("a"); link.href=imageUri; link.download=`${pageId.toLowerCase()}_Order_${generatedOrderID}.png`; document.body.appendChild(link); link.click(); document.body.removeChild(link);
}
async function handleCounterCheckoutSequence(){
    const nameVal=document.getElementById('fullName').value.trim(); const phoneVal=document.getElementById('phone').value.trim();
    const ordersVal=getFormattedOrdersText(); const pageId=getPageId(); const activePsid=document.getElementById('displayPsid').value;
    if(!nameVal||!phoneVal){ document.getElementById('errorMsg').innerText="⚠️ Paki-fillup ang Pangalan at Contact"; document.getElementById('errorMsg').style.display="block"; return; }
    if(!isPsidVerifiedFromSuggestion||activePsid==="MESSENGER_WEB_USER"){ alert("⚠️ Paki-click Continue with Facebook!"); return; }
    document.getElementById('errorMsg').style.display="none";
    downloadQrCodeImageWithDetails();
    const formattedOrders=ordersVal.split(', ').join('\n'); const shareText=`💳 OVER-THE-COUNTER ADVANCE ORDER\npsid: ${activePsid}\n🔢 Order ID: #${generatedOrderID}\n🏪 Store: ${pageId}\n⏰ Clicked At: ${clickedAtTimestamp?new Date(parseInt(clickedAtTimestamp)).toLocaleString():new Date().toLocaleString()}\n💰 Total: ₱${totalAmountPesos.toFixed(2)}\n\n🛒 Orders:\n${formattedOrders}\n\n👤 Name: ${nameVal}\n📞 Contact: ${phoneVal}`;
    await saveOrderToSupabasePOS({ order_id: generatedOrderID, store_page: pageId.toLowerCase(), branch: "Counter Pickup", schedule: "Over-the-Counter", customer_name: nameVal, customer_phone: phoneVal, landmark: "Counter", orders_list: formattedOrders, plus_code: "COUNTER", latitude: 0, longitude: 0, raw_chat_output: shareText, messenger_psid: activePsid, clicked_at: clickedAtTimestamp, status: 'PENDING' });
    const messengerUrl=`https://m.me/${encodeURIComponent(pageId)}?text=${encodeURIComponent(shareText)}`; setTimeout(()=>{ window.location.href=messengerUrl; },1000);
}
async function handleProcessOrder(){
    const nameVal=document.getElementById('fullName').value.trim(); const phoneVal=document.getElementById('phone').value.trim();
    const landmarkVal=document.getElementById('landmark').value.trim(); const tableVal=document.getElementById('tableNum').value.trim();
    const paxVal=document.getElementById('paxCount').value.trim(); const schedVal=document.getElementById('scheduleOrder').value;
    const ordersVal=getFormattedOrdersText(); const isDineIn=document.getElementById("typeDineIn").checked; const pageId=getPageId(); const activePsid=document.getElementById('displayPsid').value;
    if(!nameVal||!phoneVal){ document.getElementById('errorMsg').innerText="⚠️ Paki-fillup ang Pangalan at Contact"; document.getElementById('errorMsg').style.display="block"; return; }
    if(!isPsidVerifiedFromSuggestion||activePsid==="MESSENGER_WEB_USER"){ alert("⚠️ Paki-click Continue with Facebook!"); document.getElementById('errorMsg').innerText="⚠️ Paki-click Continue with Facebook!"; document.getElementById('errorMsg').style.display="block"; return; }
    document.getElementById('errorMsg').style.display="none"; const formattedSched=formatScheduleText(schedVal);
    if(isDineIn){
        const formattedOrders=ordersVal.split(', ').join('\n• '); const shareText=`🍽️ DINE-IN TABLE RESERVATION\npsid: ${activePsid}\n🔢 Order ID: #${generatedOrderID}\n🏪 Store: ${pageId}\n⏰ Clicked At: ${clickedAtTimestamp?new Date(parseInt(clickedAtTimestamp)).toLocaleString():new Date().toLocaleString()}\n🪑 Table: ${tableVal||'Not Specified'}\n⏰ Schedule: ${formattedSched}\n👥 Party Size: ${paxVal||'2'} Pax\n💰 Total: ₱${totalAmountPesos.toFixed(2)}\n\n🛒 Advance Orders:\n• ${formattedOrders}\n\n👤 Name: ${nameVal}\n📞 Contact: ${phoneVal}`;
        await saveOrderToSupabasePOS({ order_id: generatedOrderID, store_page: pageId.toLowerCase(), branch: tableVal||"Dine-In Table", schedule: formattedSched, customer_name: nameVal, customer_phone: phoneVal, landmark: tableVal||"Dine-In", orders_list: ordersVal, plus_code: "DINE-IN", latitude: 0, longitude: 0, raw_chat_output: shareText, messenger_psid: activePsid, clicked_at: clickedAtTimestamp, status: 'PENDING' });
        const messengerUrl=`https://m.me/${encodeURIComponent(pageId)}?text=${encodeURIComponent(shareText)}`; window.location.href=messengerUrl; return;
    }
    // DELIVERY -> IPASA LAHAT SA index.html! KASAMA OID, PSID, CLICKED_AT!
    localStorage.setItem('sharemap_page',pageId); localStorage.setItem('sharemap_orderid',generatedOrderID); localStorage.setItem('sharemap_fullname',nameVal);
    localStorage.setItem('sharemap_phone',phoneVal); localStorage.setItem('sharemap_landmark',landmarkVal||"Wala"); localStorage.setItem('sharemap_schedule',formattedSched);
    localStorage.setItem('sharemap_orders',ordersVal); localStorage.setItem('sharemap_total',totalAmountPesos.toFixed(2)); localStorage.setItem('sharemap_psid',activePsid);
    localStorage.setItem('sharemap_clicked_at',clickedAtTimestamp); sessionStorage.setItem('access_granted','true');
    const queryStr=`?pass=true&page=${encodeURIComponent(pageId)}&oid=${encodeURIComponent(generatedOrderID)}&fn=${encodeURIComponent(nameVal)}&ph=${encodeURIComponent(phoneVal)}&lm=${encodeURIComponent(landmarkVal||'Wala')}&sched=${encodeURIComponent(formattedSched)}&ord=${encodeURIComponent(ordersVal)}&total=${totalAmountPesos.toFixed(2)}&psid=${encodeURIComponent(activePsid)}&clicked_at=${clickedAtTimestamp}`;
    window.location.href=`./index.html${queryStr}`;
}

window.addEventListener('DOMContentLoaded',()=>{
    const pageId=getPageId(); localStorage.setItem('sharemap_page',pageId); document.getElementById("storeUsernameDisplay").innerText=`@${pageId.toLowerCase()}`;
    const urlParams=new URLSearchParams(window.location.search); const passedOrders=urlParams.get('ord'); const passedTotal=urlParams.get('total'); const passedType=urlParams.get('type');
    const oid=urlParams.get('oid'); const psid=urlParams.get('psid'); const fn=urlParams.get('fn'); const clicked=urlParams.get('clicked_at');
    if(oid) generatedOrderID=oid; if(clicked) clickedAtTimestamp=clicked; if(psid) actualLoggedInPsid=psid; if(fn) currentFullNameFromKiosk=fn;
    if(passedTotal) totalAmountPesos=parseFloat(passedTotal)||0;
    if(passedType==='delivery') document.getElementById('typeDelivery').checked=true; else if(passedType==='dinein') document.getElementById('typeDineIn').checked=true; else if(passedType==='counter') document.getElementById('typeCounter').checked=true;
    const passedCart = urlParams.get('cart');
    if(passedCart && currentOrdersList.length===0){
        try{
            const cartObj = JSON.parse(decodeURIComponent(passedCart));
            Object.keys(cartObj).forEach(k=>{ currentOrdersList.push({name:k, qty: cartObj[k]}); });
            localStorage.setItem(`cart_${generatedOrderID||oid}`, JSON.stringify(cartObj));
        }catch(e){
            console.log("Cart parse fail, fallback to ord", e);
            if(passedOrders&&currentOrdersList.length===0){ passedOrders.split(',').forEach(itemStr=>{ let parts=itemStr.trim().split(' x'); if(parts.length===2){ currentOrdersList.push({name:parts[0].trim(),qty:parseInt(parts[1])||1}); } else if(parts.length===1&&parts[0]){ currentOrdersList.push({name:parts[0].trim(),qty:1}); } }); }
        }
    } else if(passedOrders&&currentOrdersList.length===0){ passedOrders.split(',').forEach(itemStr=>{ let parts=itemStr.trim().split(' x'); if(parts.length===2){ currentOrdersList.push({name:parts[0].trim(),qty:parseInt(parts[1])||1}); } else if(parts.length===1&&parts[0]){ currentOrdersList.push({name:parts[0].trim(),qty:1}); } }); }
    toggleServiceType(); renderOrderUI(); checkShareMapAccess(pageId); if(psid||fn||oid){ setTimeout(updatePreview,500); }
    // DAGDAG: Setup back button tray return (para hindi mawala pag nag back)
    setTimeout(setupBackButtonTrayReturn, 800);
});
document.getElementById('proceedBtn').onclick=()=>{ handleProcessOrder(); };
</script>
