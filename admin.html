<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareMap Admin Dashboard (Supabase Powered)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 620px;
            margin: 0 auto;
        }
        h2 { text-align: center; color: var(--primary); margin-top: 5px; }
        .card {
            background: var(--card);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        .store-item {
            padding: 12px 10px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .store-info div { font-size: 13px; color: #64748b; margin-top: 2px; }
        .actions { display: flex; flex-direction: column; gap: 4px; }
        .actions button {
            width: 100%;
            padding: 5px 8px;
            font-size: 11px;
            margin: 0;
        }
        .badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            display: inline-block;
        }
        .active { background: #dcfce7; color: #166534; }
        .expired { background: #fee2e2; color: #991b1b; }
        .trial { background: #fef3c7; color: #92400e; }
        .pass-set { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        .pass-none { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }
        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>👑 ShareMap License Admin</h2>

    <!-- Add / Edit Store Card -->
    <div class="card">
        <h3 style="margin-top:0; color:#1e293b;">Magdagdag / Mag-update ng Store</h3>
        
        <label>Page Username:</label>
        <input type="text" id="storeUsername" placeholder="halimbawa: marjevinsoylucena">

        <label>Client Email Address:</label>
        <input type="email" id="clientEmailInput" placeholder="halimbawa: client@gmail.com">
        
        <label>Store Portal Password (Opsyonal / Admin Override):</label>
        <input type="text" id="storePasswordInput" placeholder="Iwanang blanko kung hayaan silang mag-set sa setup link">

        <label>Plan Type:</label>
        <select id="planType" onchange="autoSetExpiry()">
            <option value="TRIAL_ACCESS">30-Day Free Trial</option>
            <option value="BRONZE_MONTHLY">Bronze Monthly (P499/mo)</option>
            <option value="PLATINUM_LIFETIME">Platinum Lifetime (No Expiry)</option>
        </select>

        <label>Expiry Date (YYYY-MM-DD):</label>
        <input type="date" id="expiryDate">

        <button onclick="saveStoreLicense()" style="background-color: #16a34a; margin-top:5px;">💾 I-save sa Supabase</button>
    </div>

    <!-- Search & Filter Card -->
    <div class="card">
        <h3 style="margin-top:0; color:#1e293b;">Lista ng mga Store</h3>
        <input type="text" id="searchInput" placeholder="Mag-search ng Store Username..." onkeyup="filterStores()">
        
        <div id="storeListContainer" style="max-height: 350px; overflow-y: auto; margin-top: 10px;">
            <p style="text-align: center; color: #94a3b8;">Lino-load ang listahan mula sa Supabase...</p>
        </div>
    </div>
</div>

<!-- Modal Activation Dialog -->
<div class="modal-overlay" id="emailModal">
    <div class="modal-content">
        <h3 style="margin-top:0; color:#2563eb;">🚀 Send Activation / Setup Links</h3>
        <p style="font-size:13px; color:#64748b;">Nai-save na sa Supabase! Pindutin ang button sa ibaba para kopyahin ang template at buksan ang email App.</p>
        
        <button onclick="sendActivationEmail()" style="background-color: #2563eb; margin-top: 10px;">📧 I-open ang Email App & Copy Template</button>
        <button onclick="closeModal()" style="background-color: #64748b; margin-top: 5px;">Isara (Skip)</button>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://qeqbnhpvarsdcrdzpycr.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_KwWNvUe_KuZatiWB8nVvkQ_56JRPiif";
    const BASE_GATEWAY_URL = "https://sharemap-digital-address.github.io/m.me-kiosk-sellerpage/multigateway.html";
    const BASE_SETUP_URL = "https://sharemap-digital-address.github.io/m.me-kiosk-sellerpage/accountgateway.html";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let licensesData = [];
    let lastSavedUsername = "";
    let lastSavedEmail = "";
    let lastSavedPlan = "";
    let lastSavedExpiry = "";

    window.onload = function() {
        autoSetExpiry();
        loadLicensesFromSupabase();
    };

    function autoSetExpiry() {
        let plan = document.getElementById('planType').value;
        let d = new Date();

        if (plan === "PLATINUM_LIFETIME") {
            document.getElementById('expiryDate').value = "";
            document.getElementById('expiryDate').disabled = true;
        } else {
            document.getElementById('expiryDate').disabled = false;
            let days = 30;
            d.setDate(d.getDate() + days);
            document.getElementById('expiryDate').value = d.toISOString().split('T')[0];
        }
    }

    async function loadLicensesFromSupabase() {
        const { data, error } = await supabaseClient.from('licenses').select('*').order('username', { ascending: true });
        if (error) {
            alert("Error sa pag-fetch sa Supabase: " + error.message);
            return;
        }
        licensesData = data || [];
        renderStores(licensesData);
    }

    function renderStores(data) {
        const container = document.getElementById('storeListContainer');
        container.innerHTML = "";

        if(data.length === 0) {
            container.innerHTML = `<p style="text-align: center; color: #94a3b8;">Walang nakitang account sa Supabase.</p>`;
            return;
        }

        let today = new Date().toISOString().split('T')[0];

        data.forEach(store => {
            let statusClass = "active";
            let statusText = "Active";

            if (store.expiry && today > store.expiry) {
                statusClass = "expired";
                statusText = "Expired";
            } else if (store.plan === "TRIAL_ACCESS") {
                statusClass = "trial";
                statusText = "Trial";
            }

            let expiryLabel = store.expiry ? store.expiry : "Lifetime";
            let emailLabel = store.email ? store.email : "Wala pang email";
            
            // PASSWORD STATUS BADGE
            let passBadge = "";
            if (store.password && store.password.trim() !== "") {
                passBadge = `<span class="badge pass-set" title="Current Password">🔑 Pass: <b>${store.password}</b></span>`;
            } else {
                passBadge = `<span class="badge pass-none">⚠️ No Pass Set</span>`;
            }

            let div = document.createElement('div');
            div.className = "store-item";
            div.innerHTML = `
                <div class="store-info">
                    <strong>@${store.username}</strong> <span class="badge ${statusClass}">${statusText}</span> ${passBadge}
                    <div>Email: ${emailLabel}</div>
                    <div>Plan: ${store.plan} | Expiry: ${expiryLabel}</div>
                </div>
                <div class="actions">
                    <button onclick="editStore('${store.username}')" style="background:#2563eb;">✏️ Edit</button>
                    <button onclick="resetPassword('${store.username}')" style="background:#eab308; color:#000;">🔑 Reset Pass</button>
                    <button onclick="deleteStore('${store.username}')" style="background:#dc2626;">🗑️ Del</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function filterStores() {
        let query = document.getElementById('searchInput').value.toLowerCase();
        let filtered = licensesData.filter(store => store.username.toLowerCase().includes(query));
        renderStores(filtered);
    }

    function editStore(username) {
        let store = licensesData.find(s => s.username === username);
        if(store) {
            document.getElementById('storeUsername').value = store.username;
            document.getElementById('clientEmailInput').value = store.email || "";
            document.getElementById('storePasswordInput').value = store.password || "";
            document.getElementById('planType').value = store.plan;
            document.getElementById('expiryDate').value = store.expiry || "";
            if (store.plan === "PLATINUM_LIFETIME") {
                document.getElementById('expiryDate').disabled = true;
            } else {
                document.getElementById('expiryDate').disabled = false;
            }
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    }

    async function saveStoreLicense() {
        const username = document.getElementById('storeUsername').value.trim().toLowerCase();
        const email = document.getElementById('clientEmailInput').value.trim();
        const password = document.getElementById('storePasswordInput').value.trim();
        const plan = document.getElementById('planType').value;
        const expiry = (plan === "PLATINUM_LIFETIME") ? null : document.getElementById('expiryDate').value;

        if(!username) {
            alert("Pakipunan ang store username.");
            return;
        }

        const payload = {
            username: username,
            status: "ACTIVE",
            plan: plan,
            expiry: expiry,
            email: email ? email : null,
            password: password ? password : null
        };

        const { error } = await supabaseClient.from('licenses').upsert(payload, { onConflict: 'username' });

        if (error) {
            alert("Error sa pag-save: " + error.message);
            return;
        }

        lastSavedUsername = username;
        lastSavedEmail = email;
        lastSavedPlan = plan;
        lastSavedExpiry = expiry;

        // Clear input form
        document.getElementById('storeUsername').value = "";
        document.getElementById('clientEmailInput').value = "";
        document.getElementById('storePasswordInput').value = "";

        await loadLicensesFromSupabase();
        document.getElementById('emailModal').style.display = 'flex';
    }

    async function resetPassword(username) {
        let newPass = prompt(`Maglagay ng bagong password para sa @${username} (o iwanang blangko para ibalik sa No Password Set):`);
        if (newPass === null) return; // Cancelled

        let valToSave = newPass.trim() === "" ? null : newPass.trim();

        const { error } = await supabaseClient
            .from('licenses')
            .update({ password: valToSave })
            .eq('username', username);

        if (error) {
            alert("Error sa pag-reset ng password: " + error.message);
        } else {
            alert(`✅ Tagumpay na na-update/reset ang password para sa @${username}!`);
            loadLicensesFromSupabase();
        }
    }

    async function deleteStore(username) {
        if(!confirm(`Sigurado ka bang gusto mong tanggalin si @${username}?`)) return;

        const { error } = await supabaseClient.from('licenses').delete().eq('username', username);
        if (error) {
            alert("Error sa pagbura: " + error.message);
        } else {
            alert("Nababura na ang account.");
            loadLicensesFromSupabase();
        }
    }

    function closeModal() {
        document.getElementById('emailModal').style.display = 'none';
    }

    function sendActivationEmail() {
        const gatewayLink = `${BASE_GATEWAY_URL}?page=${lastSavedUsername}`;
        const setupPasswordLink = `${BASE_SETUP_URL}?page=${lastSavedUsername}`;
        const emailToSend = lastSavedEmail || "";

        let subject = "🚀 Welcome to ShareMap Kiosk - Account Activation & Password Setup";
        let emailBody = `Magandang araw po! 👋

Maraming salamat sa pagtangkilik sa ShareMap Order Gateway System.

1. 🔗 Inyong Customer Order Gateway Link:
${gatewayLink}

2. 🔑 I-set up ang inyong Portal Password (Isang Mabilisang Hakbang):
Mangyaring i-click ang link sa ibaba upang makagawa ng inyong sariling password para sa inyong Kiosk Management Portal:
👉 Password Setup Link: ${setupPasswordLink}

Plan: ${lastSavedPlan}
Expiry Date: ${lastSavedExpiry || 'Lifetime'}

Kung may tanong ka o kailangan ng tulong, mag-reply lamang sa email na ito. Happy selling!

Magalang na sumasainyo,
Jayrome
ShareMap Developer & Administrator`;

        navigator.clipboard.writeText(emailBody).then(() => {
            alert("✅ Na-copy na sa clipboard ang email message template!");
        });

        if (emailToSend) {
            const mailtoUrl = `mailto:${emailToSend}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(emailBody)}`;
            window.location.href = mailtoUrl;
        }

        closeModal();
    }
</script>

</body>
</html>
